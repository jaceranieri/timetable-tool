                                                        />
                                                        <span className="w-6 h-6 inline-flex items-center justify-center" role="img"
                                                            aria-label={status === 'problem' ? `${g.name} has problems to fix` : status === 'ready' ? `${g.name} is ready` : `${g.name} isn't finished yet`}
                                                            title={status === 'problem' ? 'Has problems to fix' : status === 'ready' ? 'Ready' : 'Not finished yet'}>
                                                            {status === 'problem' && <AlertTriangleIcon className="w-5 h-5 text-red-600" aria-hidden="true" />}
                                                            {status === 'ready' && <CheckCircleIcon className="w-5 h-5 text-brand-dark" aria-hidden="true" />}
                                                            {status === 'open' && <span className="w-4 h-4 rounded-full border-2 border-dashed border-slate-300" aria-hidden="true"></span>}
                                                        </span>
                                                    </div>
                                                </div>

                                                {pasteFor === g.id && (
                                                    <div className="m-3 p-3 border border-slate-200 rounded-lg bg-slate-50 space-y-2 animate-pop">
                                                        <Label htmlFor={`paste-${g.id}`}>Paste class names and teachers</Label>
                                                        <p id={`paste-${g.id}-help`} className="text-xs text-slate-600">
                                                            In your spreadsheet, select two columns (class name, then teacher), copy, and paste here: one class per line.
                                                            This replaces the {g.name} classes below.
                                                        </p>
                                                        <textarea
                                                            id={`paste-${g.id}`}
                                                            aria-describedby={`paste-${g.id}-help`}
                                                            rows={6}
                                                            value={pasteText}
                                                            onChange={(e) => setPasteText(e.target.value)}
                                                            placeholder={"3 Blue\tMs Lee\n3 Gold\tMr Tran"}
                                                            className="w-full rounded-md border border-slate-200 bg-white p-2 text-sm font-mono focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950"
                                                        />
                                                        <div className="flex flex-wrap items-center justify-end gap-2">
                                                            <span className="text-xs text-slate-600 mr-auto" aria-live="polite">
                                                                {pasted.length ? `Found ${pasted.length} ${pasted.length === 1 ? 'class' : 'classes'}: ${pasted.slice(0, 3).map(row => row.className || '(no name)').join(', ')}${pasted.length > 3 ? ', ...' : ''}` : ''}
                                                            </span>
                                                            <Button variant="outline" className="h-9" onClick={() => { setPasteFor(null); setPasteText(""); }}>Cancel</Button>
                                                            <Button variant="brand" className="h-9" disabled={!pasted.length} onClick={() => applyPaste(g.id, pasted)}>
                                                                {pasted.length ? `Use these ${pasted.length} ${pasted.length === 1 ? 'class' : 'classes'}` : 'Paste some rows first'}
                                                            </Button>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="p-2 sm:p-3">
                                                    <ul className="space-y-1">
                                                        {staffForGrade.map((s, idx) => {
                                                            const globalIdx = data.staffing.findIndex(st => st.id === s.id);
                                                            const hasError = Object.values(errors.staffing?.[globalIdx] || {}).some(Boolean);
                                                            const isBlank = isBlankClass(s);
                                                            const rowName = s.className.trim() || `class ${idx + 1}`;
                                                            return (
                                                                <li key={s.id} id={`class-row-${s.id}`}
                                                                    className={`flex flex-wrap sm:flex-nowrap items-center gap-2 rounded-lg px-2 py-1.5 transition-colors ${hasError ? 'bg-red-50/70' : isBlank ? 'opacity-60' : 'hover:bg-slate-50'}`}>
                                                                    <button
                                                                        ref={(el) => { colorTriggerRefs.current[s.id] = el; }}
                                                                        type="button"
                                                                        onClick={() => setColorPickerFor(prev => prev === s.id ? null : s.id)}
                                                                        aria-label={`Colour for ${rowName}`}
                                                                        aria-haspopup="dialog"
                                                                        aria-expanded={colorPickerFor === s.id}
                                                                        title="Choose class colour"
                                                                        className="w-12 h-12 shrink-0 inline-flex items-center justify-center rounded-md border border-black/10 shadow-sm text-base font-bold text-slate-800/80 cursor-pointer transition-transform hover:scale-105 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950"
                                                                        style={{ backgroundColor: s.color || CLASS_COLOR_PALETTE[0] }}
                                                                    >
                                                                        <span aria-hidden="true">{idx + 1}</span>
                                                                    </button>
                                                                    <div className="flex-1 min-w-[10rem]">
                                                                        <Input id={`class-${s.id}-name`} boxLabel="Class name" aria-label={`${g.name} class ${idx + 1} name`} placeholder="e.g. 3 Blue" value={s.className} onChange={(e) => updateList('staffing', globalIdx, 'className', e.target.value)} error={errors.staffing?.[globalIdx]?.className} />
                                                                    </div>
                                                                    <div className="flex-1 min-w-[10rem]">
                                                                        <Input id={`class-${s.id}-teacher`} boxLabel="Teacher" aria-label={`${g.name} class ${idx + 1} teacher`} placeholder={isBlank ? "Blank row: skipped" : "e.g. Ms Lee"} value={s.teacher} onChange={(e) => updateList('staffing', globalIdx, 'teacher', e.target.value)} error={errors.staffing?.[globalIdx]?.teacher} />
                                                                    </div>
                                                                    <RemoveButton label={`Remove ${rowName}`} onClick={() => removeClass(s.id)} />
                                                                    {colorPickerFor === s.id && ReactDOM.createPortal(
                                                                        <React.Fragment>
                                                                            <div className="fixed inset-0 z-40" onClick={() => setColorPickerFor(null)} />
                                                                            <div
                                                                                role="dialog"
                                                                                aria-label={`Colour for ${rowName}`}
                                                                                className="fixed z-50 p-2.5 bg-white border border-slate-200 rounded-lg shadow-xl animate-pop w-[152px]"
                                                                                style={{ top: colorPickerPos.top, left: colorPickerPos.left }}
                                                                            >
                                                                                <div className="grid grid-cols-4 gap-1.5">
                                                                                    {CLASS_COLOR_PALETTE.map((hex) => (
                                                                                        <button
                                                                                            key={hex}
                                                                                            type="button"
                                                                                            onClick={() => { updateList('staffing', globalIdx, 'color', hex); setColorPickerFor(null); }}
                                                                                            title={hex}
                                                                                            aria-label={`Colour ${hex}`}
                                                                                            aria-pressed={s.color === hex}
                                                                                            className={`w-5 h-5 rounded-sm border transition-all ${s.color === hex ? 'ring-2 ring-offset-1 ring-slate-400 border-white' : 'border-black/10 hover:scale-110'}`}
                                                                                            style={{ backgroundColor: hex }}
                                                                                        />
                                                                                    ))}
                                                                                    <label
                                                                                        htmlFor={`custom-color-${s.id}`}
                                                                                        title="Custom colour"
                                                                                        className={`relative w-5 h-5 rounded-sm border cursor-pointer overflow-hidden transition-all ${!CLASS_COLOR_PALETTE.includes(s.color) ? 'ring-2 ring-offset-1 ring-slate-400 border-white' : 'border-black/10 hover:scale-110'}`}
                                                                                        style={!CLASS_COLOR_PALETTE.includes(s.color) && s.color
                                                                                            ? { backgroundColor: s.color }
                                                                                            : { background: 'conic-gradient(from 0deg, #FFADAD, #FDFFB6, #CAFFBF, #A0C4FF, #BDB2FF, #FFC6FF, #FFADAD)' }}
                                                                                    >
                                                                                        <input
                                                                                            id={`custom-color-${s.id}`}
                                                                                            type="color"
                                                                                            aria-label="Custom colour"
                                                                                            value={s.color || CLASS_COLOR_PALETTE[0]}
                                                                                            onChange={(e) => { updateList('staffing', globalIdx, 'color', e.target.value); setColorPickerFor(null); }}
                                                                                            className="absolute w-0 h-0 opacity-0"
                                                                                        />
                                                                                    </label>
                                                                                </div>
                                                                            </div>
                                                                        </React.Fragment>,
                                                                        document.body
                                                                    )}
                                                                </li>
                                                            );
                                                        })}
                                                    </ul>
                                                </div>
                                            </section>
                                        );
                                    })}
                                </div>
                        </div>

                    </div>
                );
            };

            const renderSpecialistsStep = () => {
                const cycleMismatches = findCycleMismatches(data);
                return (
                    <div className="space-y-8 animate-step" key="step-specialists">
                        {/* Specialist Teachers */}
                        <div>
                            <SectionHeader id="specialists" title="Specialist Profiles"
                                info="Specialist teachers (e.g. PE, music) and the KLA each one teaches. Each gets their own tab to timetable their lessons, which are then synced onto the class tabs. Rows left blank are skipped.">
                                <Button variant="brand" size="sm" onClick={() => addToList('specialists', { name: "", kla: "", cycle: 1 })} className="h-8 gap-1">
                                    <PlusIcon className="w-4 h-4 mr-1" /> Add Specialist
                                </Button>
                            </SectionHeader>

                            <div id="list-container-specialists" className="space-y-1">
                                {data.specialists.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center p-6 border-2 border-dashed border-slate-200 rounded-lg bg-slate-50/50 text-slate-500 animate-pop">
                                        <p className="text-sm font-medium text-slate-700 mb-2">No specialist teachers added</p>
                                        <Button variant="outline" size="sm" onClick={() => addToList('specialists', { name: "", kla: "", cycle: 1 })}>Add Specialist</Button>
                                    </div>
                                ) : (
                                    data.specialists.map((s, i) => (
                                        <div key={s.id} className="animate-pop py-1 space-y-1.5">
                                        <div className="flex flex-wrap sm:flex-nowrap items-center gap-2">
                                            <div className="flex-1 min-w-[10rem]">
                                                <Input id={`spec-${s.id}-name`} boxLabel="Specialist" placeholder="e.g. Mr Smith" value={s.name} onChange={(e) => updateList('specialists', i, 'name', e.target.value)} error={errors.specialists?.[i]?.name} />
                                            </div>
                                            <div className="flex-1 min-w-[10rem]">
                                                <Select id={`spec-${s.id}-kla`} boxLabel="KLA" value={s.kla} onChange={(e) => updateList('specialists', i, 'kla', e.target.value)} error={errors.specialists?.[i]?.kla}>
                                                    <option value="">Choose a KLA...</option>
                                                    {data.klas.filter(k => k.name.trim() && !/^non[- ]?curricul(?:ar|um)$/i.test(k.name.trim())).map(k => (
                                                        <option key={k.id} value={k.name}>{k.name}</option>
                                                    ))}
                                                </Select>
                                            </div>
                                            <CycleButton id={`spec-${s.id}-cycle`} size="lg" owner={s.name.trim() || `Specialist ${i + 1}`} value={s.cycle}
                                                lockedReason={editing && s.originalName ? "Can't be changed: this specialist's tab is built for this cycle" : undefined}
                                                onChange={(weeks) => updateList('specialists', i, 'cycle', clampCycle(weeks))} />
                                            <RemoveButton label={`Remove ${s.name.trim() || 'this specialist'}`} onClick={() => removeFromList('specialists', s.id)} />
                                        </div>
                                        {cycleMismatches[s.id] && (
                                            <p className="flex items-start gap-1.5 text-xs text-amber-900 bg-amber-50 border border-amber-200 rounded-md px-2 py-1.5">
                                                <AlertTriangleIcon className="w-3.5 h-3.5 text-amber-600 shrink-0 mt-0.5" aria-hidden="true" />
                                                <span>{describeCycleMismatch(s, cycleMismatches[s.id])}</span>
                                            </p>
                                        )}
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                    </div>
                );
            };

            const renderActivitiesStep = () => (
                <div className="space-y-8 animate-step" key="step-activities">
                        {/* Extracurricular Activities */}
                        <div>
                            <SectionHeader id="activities" title="Extra-Curricular Activities"
                                info="Events such as assembly or library that class teachers can put on their timetables, counted as teaching time. Amadeus - Tutorials is required for Years 3-6, so it can't be removed.">
                                <Button variant="brand" size="sm" onClick={() => addToList('activities', { name: "" })} className="h-8 gap-1">
                                    <PlusIcon className="w-4 h-4 mr-1" /> Add Activity
                                </Button>
                            </SectionHeader>

                            <div id="list-container-activities" className="space-y-1">
                                {data.activities.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center p-6 border-2 border-dashed border-slate-200 rounded-lg bg-slate-50/50 text-slate-500 animate-pop">
                                        <p className="text-sm font-medium text-slate-700 mb-2">No extra-curriculars added</p>
                                        <Button variant="outline" size="sm" onClick={() => addToList('activities', { name: "" })}>Add Activity</Button>
                                    </div>
                                ) : (
                                    data.activities.map((a, i) => (
                                        <div key={a.id} className="flex items-center gap-2 py-1 animate-pop">
                                            <div className="flex-1">
                                                <Input id={`activity-${a.id}`} boxLabel={a.locked ? "Activity (required for Years 3-6)" : "Activity"} placeholder="e.g. Debate Club" value={a.name} onChange={(e) => updateList('activities', i, 'name', e.target.value)} error={errors.activities?.[i]?.name} disabled={a.locked} />
                                            </div>
                                            <RemoveButton label={`Remove ${a.name.trim() || 'this activity'}`} onClick={() => removeFromList('activities', a.id)} disabled={a.locked} />
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                </div>
            );

            const renderSummaryStep = () => {
                const classesToGenerate = getClassesToGenerate(data);
                const gradeGroups = data.grades
                    .map(g => ({ grade: g, classes: classesToGenerate.filter(c => c.gradeId === g.id) }))
                    .filter(group => group.classes.length);
                const specialists = getSpecialistsToGenerate(data);
                const activities = data.activities.filter(a => a.name.trim());
                const estimate = estimateGeneration(data);
                const cycleMismatches = findCycleMismatches(data);
                const schoolName = data.schoolName.trim();
                const dayHours = Math.floor(dailyTeachingMins / 60);
                const dayMinutes = dailyTeachingMins % 60;

                const renderEditLink = (target, what) => (
                    <button type="button" onClick={() => goToStep(target)}
                        className="text-sm font-semibold text-brand-dark hover:underline rounded px-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950">
                        Edit<span className="sr-only"> {what}</span>
                    </button>
                );

                // The four headline cards; each opens its details below.
                const cards = [
                    { key: 'classes', label: 'Classes', value: classesToGenerate.length,
                        detail: `in ${plural(gradeGroups.length, 'grade', 'grades')}` },
                    { key: 'day', label: 'School day',
                        value: <>{dayHours}<span className="text-3xl">h</span>{dayMinutes ? <> {dayMinutes}<span className="text-3xl">m</span></> : ''}</>,
                        detail: 'teaching a day' },
                    { key: 'specialists', label: 'Specialists', value: specialists.length,
                        detail: specialists.length ? [...new Set(specialists.map(s => s.kla))].join(', ') : 'none' },
                    { key: 'activities', label: 'Extra-curriculars', value: activities.length,
                        detail: activities.length === 1 ? 'activity' : 'activities' }
                ];

                const details = {
                    classes: {
                        title: `Classes (${classesToGenerate.length})`,
                        edit: renderEditLink(STEP.CLASSES, 'grades and classes'),
                        body: (
                            <table className="w-full text-sm">
                                <tbody>
                                    {gradeGroups.map(group => (
                                        <tr key={group.grade.id} className="align-top border-t border-slate-100 first:border-t-0">
                                            <th scope="row" className="text-left font-semibold text-slate-900 py-2 pr-4 whitespace-nowrap w-0">
                                                {group.grade.name}
                                                <span className="block text-xs font-normal text-slate-600">{group.grade.cycle}-week cycle</span>
                                            </th>
                                            <td className="py-2">
                                                <ul className="flex flex-wrap gap-1.5">
                                                    {group.classes.map(c => (
                                                        <li key={c.id} className="inline-flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-md px-2 py-0.5">
                                                            <span className="w-2.5 h-2.5 rounded-full border border-black/10" style={{ backgroundColor: c.color || CLASS_COLOR_PALETTE[0] }} aria-hidden="true"></span>
                                                            <span className="font-medium text-slate-900">{c.className}</span>
                                                            <span className="text-slate-600">{c.teacher}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )
                    },
                    day: {
                        title: 'School day',
                        edit: renderEditLink(STEP.SCHEDULE, 'school day and breaks'),
                        body: (
                            <dl className="grid grid-cols-2 sm:grid-cols-4 gap-x-4 gap-y-3 text-sm">
                                <div>
                                    <dt className="text-xs text-slate-600">Hours</dt>
                                    <dd className="font-semibold text-slate-900">{formatAMPM(data.schoolStart)} - {formatAMPM(data.schoolEnd)}</dd>
                                </div>
                                <div>
                                    <dt className="text-xs text-slate-600">Breaks</dt>
                                    <dd className="text-slate-900">
                                        {data.breaks.length ? data.breaks.map(b => (
                                            <span key={b.id} className="block">{b.name || 'Unnamed'} {formatAMPM(b.start)} - {formatAMPM(b.end)}</span>
                                        )) : 'None'}
                                    </dd>
                                </div>
                                <div>
                                    <dt className="text-xs text-slate-600">Teaching time a day</dt>
                                    <dd className="font-semibold text-brand-dark">{formatMinutes(dailyTeachingMins)}</dd>
                                </div>
                                <div>
                                    <dt className="text-xs text-slate-600">A week</dt>
                                    <dd className="font-semibold text-brand-dark">{formatMinutes(dailyTeachingMins * 5)}</dd>
                                </div>
                            </dl>
                        )
                    },
                    specialists: {
                        title: `Specialists (${specialists.length})`,
                        edit: renderEditLink(STEP.SPECIALISTS, 'specialists'),
                        body: specialists.length ? (
                            <ul className="divide-y divide-slate-100 text-sm">
                                {specialists.map(s => (
                                    <li key={s.id} className="flex items-baseline justify-between gap-3 py-1.5">
                                        <span className="font-medium text-slate-900">{s.name}</span>
                                        <span className="text-slate-600 text-right">{s.kla} · {s.cycle || 1}-week cycle</span>
                                    </li>
                                ))}
                            </ul>
                        ) : <p className="text-sm text-slate-600">No specialists.</p>
                    },
                    activities: {
                        title: `Extra-curricular activities (${activities.length})`,
                        edit: renderEditLink(STEP.ACTIVITIES, 'extra-curricular activities'),
                        body: activities.length ? (
                            <ul className="flex flex-wrap gap-1.5 text-sm">
                                {activities.map(a => (
                                    <li key={a.id} className="bg-slate-50 border border-slate-200 rounded-md px-2 py-0.5 text-slate-900">{a.name.trim()}</li>
                                ))}
                            </ul>
                        ) : <p className="text-sm text-slate-600">No activities.</p>
                    }
                };
                const open = summaryDetail && details[summaryDetail];
                const changes = editing && editOriginal ? describeUpdate(editOriginal, data) : [];

                return (
                    <div className="animate-step space-y-6" key="step-summary">
                        <div>
                            {editing ? (
                                <h3 className="text-xl font-bold tracking-tight text-slate-900">Ready to update <span className="text-brand-dark">{editTarget.fileName}</span></h3>
                            ) : (
                                <h3 className="text-xl font-bold tracking-tight text-slate-900">Ready to generate{schoolName ? <> for <span className="text-brand-dark">{schoolName}</span></> : ''}</h3>
                            )}
                            <p className="text-sm text-slate-600 mt-1">Click a card to see its details.</p>
                        </div>

                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                            {cards.map(card => {
                                const selected = summaryDetail === card.key;
                                return (
                                    <button key={card.key} type="button" id={`summary-card-${card.key}`}
                                        aria-expanded={selected} aria-controls="summary-details"
                                        onClick={() => setSummaryDetail(selected ? null : card.key)}
                                        className={`flex flex-col justify-between text-left min-h-[11rem] rounded-2xl border-2 p-5 transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 focus-visible:ring-offset-2 ${
                                            selected ? 'border-brand-dark bg-brand-green/10 shadow-md -translate-y-0.5' : 'border-slate-200 bg-white shadow-sm hover:border-brand-green hover:-translate-y-0.5 hover:shadow-md'}`}>
                                        <span className={`text-xs font-bold uppercase tracking-wider ${selected ? 'text-brand-dark' : 'text-slate-600'}`}>{card.label}</span>
                                        <span className="text-5xl font-extrabold tracking-tight text-slate-900 leading-none my-3">{card.value}</span>
                                        <span className="text-sm text-slate-600 leading-snug">{card.detail}</span>
                                    </button>
                                );
                            })}
                        </div>

                        <div id="summary-details" role="region" aria-label={open ? open.title : 'Details'}>
                            {open && (
                                <section key={summaryDetail} className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm animate-pop">
                                    <div className="flex items-center justify-between gap-3 mb-3">
                                        <h4 className="text-base font-bold text-slate-900">{open.title}</h4>
                                        {open.edit}
                                    </div>
                                    {open.body}
                                </section>
                            )}
                        </div>

                        {Object.keys(cycleMismatches).length > 0 && (
                            <div className="flex items-start gap-1.5 text-sm text-amber-900 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
                                <AlertTriangleIcon className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" aria-hidden="true" />
                                <div className="space-y-1">
                                    {specialists.filter(s => cycleMismatches[s.id]).map(s => (
                                        <p key={s.id}>{describeCycleMismatch(s, cycleMismatches[s.id])}</p>
                                    ))}
                                </div>
                            </div>
                        )}

                        {editing && (
                            <section aria-labelledby="changes-heading" className="rounded-2xl border border-amber-200 bg-amber-50/60 p-5">
                                <h4 id="changes-heading" className="text-base font-bold text-slate-900 mb-2">
                                    {changes.length ? `${changes.length} ${changes.length === 1 ? 'change' : 'changes'} to make` : 'No changes yet'}
                                </h4>
                                {changes.length ? (
                                    <ul className="list-disc pl-5 space-y-1 text-sm text-slate-800">
                                        {changes.map((change, i) => <li key={i}>{change}</li>)}
                                    </ul>
                                ) : (
                                    <p className="text-sm text-slate-700">Change the setup in the earlier steps; the changes are listed here before anything is updated.</p>
                                )}
                                <p className="text-xs text-slate-600 mt-3">Only these changes are made. Lessons already entered are kept; archived tabs are hidden, never deleted.</p>
                            </section>
                        )}

                        <div className="flex flex-col items-center gap-3 pt-4 pb-2">
                            {editing ? (
                                <button type="button" onClick={handleSubmit} disabled={isGenerating || !changes.length}
                                    className={`${changes.length ? 'animate-soft-pulse' : ''} inline-flex items-center justify-center gap-3 rounded-2xl bg-brand-dark px-12 py-5 text-xl font-bold text-white hover:bg-[#00663C] transition-colors disabled:opacity-50 disabled:cursor-not-allowed focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-green/40`}>
                                    Update timetable
                                </button>
                            ) : (
                            <button type="button" onClick={handleSubmit} disabled={isGenerating}
                                className="animate-soft-pulse inline-flex items-center justify-center gap-3 rounded-2xl bg-brand-dark px-12 py-5 text-xl font-bold text-white hover:bg-[#00663C] transition-colors disabled:opacity-60 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-green/40">
                                Generate timetable
                            </button>
                            )}
                            <p className={`text-sm text-slate-600 ${editing ? 'hidden' : ''}`}>
                                {plural(classesToGenerate.length, 'class tab', 'class tabs')} and {plural(specialists.length, 'specialist tab', 'specialist tabs')} · takes {estimate.text}
                            </p>
                        </div>
                    </div>
                );
            };

            return (
                <div className="w-full flex flex-col items-center">

                    {/* BRANDING HEADER, with the menu for saving and loading the setup */}
                    <div className="w-full flex items-center justify-between gap-4 mb-8">
                        <div className="flex items-center gap-4">
                            <div className="shrink-0 rounded-2xl shadow-md shadow-brand-dark/20">
                                <LogoMark />
                            </div>
                            <h1 className="text-[32px] leading-none font-extrabold tracking-tight text-slate-900">
                                the<span className="text-brand-dark">timetable</span>tool<span className="text-brand-green">.</span>
                            </h1>
                        </div>
                        {!isGenerating && !isSuccess && !draftOffer && (
                            <MoreMenu
                                boxed
                                icon={<MenuIcon />}
                                label="Menu"
                                items={[
                                    { label: 'Edit an existing timetable', hint: 'Add, rename or archive classes and specialists in a timetable you made', onSelect: () => setLinkDialog('edit') },
                                    { label: 'Start from an existing timetable', hint: 'A new timetable from one you made, e.g. last year\'s', onSelect: () => setLinkDialog('copy') },
                                    { label: 'Save setup to a file', hint: 'Download this setup to load again later', onSelect: saveSetupFile },
                                    { label: 'Load a saved setup', hint: 'Fill the wizard from a setup file', onSelect: () => fileInputRef.current && fileInputRef.current.click() }
                                ]}
                            />
                        )}
                    </div>

                    {linkDialog && <LinkDialog mode={linkDialog} onLoaded={loadTimetable} onClose={() => setLinkDialog(null)} />}

                    {/* Editing an existing timetable */}
                    {editing && !isGenerating && !isSuccess && !draftOffer && (
                        <div role="status" className="w-full mb-4 flex flex-wrap items-center gap-x-3 gap-y-2 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">
                            <PencilLineIcon />
                            <span className="flex-1 min-w-[12rem]">Editing <strong>{editTarget.fileName}</strong>. Changes are made to this timetable when you update it; lessons already entered are kept.</span>
                            <a href={editTarget.url} target="_blank" rel="noopener noreferrer" className="font-semibold underline hover:text-amber-700">Open it<span className="sr-only"> (opens in a new tab)</span></a>
                            <button type="button" onClick={stopEditing} className="font-semibold underline hover:text-amber-700">Stop editing</button>
                        </div>
                    )}

                    {/* GENERATION PROGRESS SCREEN */}
                    {isGenerating ? (
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 animate-pop">
                            <CardContent className="p-8 sm:p-12 flex flex-col items-center text-center gap-5">
                                <h2 className="text-xl font-bold text-slate-900">{editing ? 'Updating your timetable' : 'Generating your timetable'}</h2>
                                <div className="w-full max-w-lg flex items-center gap-3">
                                    <div className="flex-1 bg-slate-100 h-3 rounded-full overflow-hidden border border-slate-200"
                                        role="progressbar" aria-label="Timetable generation" aria-valuemin={0} aria-valuemax={100} aria-valuenow={loadingProgress}>
                                        <div className="bg-brand-dark h-full rounded-full transition-all duration-500 ease-out" style={{ width: `${loadingProgress}%` }}></div>
                                    </div>
                                    <span className="text-sm font-mono font-semibold text-slate-700 w-12 text-right" aria-hidden="true">{loadingProgress}%</span>
                                </div>
                                {(() => {
                                    // The reminder, then three quips, then the reminder again...
                                    const reminder = `This usually takes ${estimateGeneration(data).text}. Please keep this window open.`;
                                    const quipNumber = quipTick - Math.floor(quipTick / 4) - 1;
                                    const text = quipTick % 4 === 0
                                        ? reminder
                                        : GENERATING_QUIPS[(quipStart.current + quipNumber) % GENERATING_QUIPS.length];
                                    return (
                                        <React.Fragment>
                                            <p key={quipTick} aria-hidden="true" className="text-sm text-slate-600 max-w-md min-h-[2.5rem] animate-pop">{text}</p>
                                            <p className="sr-only">{reminder}</p>
                                        </React.Fragment>
                                    );
                                })()}
                                <Button variant="ghost" className="h-9 text-slate-700" aria-expanded={showLogs} aria-controls="generation-log" onClick={() => setShowLogs(prev => !prev)}>
                                    {showLogs ? 'Hide the log' : 'View the log'}
                                </Button>
                                {showLogs && (
                                    <div id="generation-log" className="w-full max-w-lg text-left bg-slate-50 border border-slate-200 rounded-lg animate-pop">
                                        <div className="flex justify-between px-3 py-2 border-b border-slate-200 text-xs text-slate-600">
                                            <span>{plural(logs.length, 'step', 'steps')}</span>
                                            <span>Elapsed <span className="font-mono">{formatElapsed(elapsedSeconds)}</span></span>
                                        </div>
                                        <ol ref={logContainerRef} className="p-3 max-h-[220px] overflow-y-auto custom-scrollbar text-xs space-y-1.5">
                                            {logs.map((log) => (
                                                <li key={log.id} className="flex items-start gap-2.5 leading-relaxed">
                                                    <span className="text-slate-500 font-mono shrink-0">{log.time}</span>
                                                    <span className="text-slate-800 break-words flex-1">{log.text}</span>
                                                </li>
                                            ))}
                                        </ol>
                                    </div>
                                )}
                            </CardContent>
                        </Card>
                    ) : isSuccess ? (
                        /* SUCCESS SCREEN */
                        <div className="w-full rounded-2xl shadow-xl overflow-hidden animate-pop bg-gradient-to-br from-[#00C774] via-[#00A35F] to-[#00663C] text-white">
                            <div className="px-6 sm:px-12 pt-10 pb-10 flex flex-col items-center text-center">
                                <div className="animate-success mb-4 w-16 h-16 rounded-full bg-white/20 ring-4 ring-white/20 flex items-center justify-center" aria-hidden="true">
                                    <svg className="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12" /></svg>
                                </div>
                                <h2 className="text-3xl font-extrabold tracking-tight">{updateResult ? 'Your timetable is updated' : 'Your timetable is ready'}</h2>
                                {updateResult ? (
                                    <div className="text-base text-white/90 mt-2 max-w-lg">
                                        <p>{updateResult.changes.length} {updateResult.changes.length === 1 ? 'change' : 'changes'} made to <strong className="text-white">{editTarget ? editTarget.fileName : 'the timetable'}</strong>.</p>
                                        {updateResult.notes.map((note, i) => <p key={i} className="text-sm text-white/80 mt-1">{note}</p>)}
                                    </div>
                                ) : (
                                    <p className="text-base text-white/85 mt-2 max-w-md">Saved in the <strong className="text-white">Timetables</strong> folder in your My Drive.</p>
                                )}

                                {/* The picture, with the button on top of it */}
                                <div className="relative w-full max-w-2xl mt-8">
                                    <TimetableIllustration />
                                    <div className="absolute inset-0 flex items-center justify-center">
                                        <a href={generatedUrl} target="_blank" rel="noopener noreferrer"
                                            className="inline-flex items-center justify-center gap-2 rounded-2xl bg-white px-10 py-4 text-xl font-bold text-brand-dark shadow-2xl ring-1 ring-black/5 transition-transform hover:scale-105 active:scale-95 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-white/70">
                                            Open Sheet<span className="sr-only"> (opens in a new tab)</span>
                                        </a>
                                    </div>
                                </div>

                                <div className="flex flex-col sm:flex-row items-center justify-center gap-3 mt-8">
                                    <span className="inline-flex items-center gap-1">
                                        <button type="button" onClick={() => { setIsSuccess(false); setStep(LAST_STEP); }}
                                            className="h-11 px-6 rounded-xl border border-white/50 bg-white/10 text-white font-semibold hover:bg-white/20 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
                                            Keep Editing
                                        </button>
                                        <HoverInfo id="keep-editing-info" label="About Keep Editing"
                                            text={updateResult
                                                ? "Keep Editing goes back to the wizard, still editing this timetable, to make more changes."
                                                : "Keep Editing goes back to the wizard with this setup, for example to change something and generate again."} />
                                    </span>
                                    <button type="button" onClick={startNew}
                                        className="h-11 px-6 rounded-xl border border-white/50 bg-white/10 text-white font-semibold hover:bg-white/20 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
                                        New Timetable
                                    </button>
                                </div>
                            </div>
                        </div>
                    ) : draftOffer ? (
                        /* RESUME SCREEN */
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 overflow-hidden animate-pop flex flex-col">
                            <CardContent className="p-10 flex flex-col items-center justify-center text-center min-h-[360px]">
                                <h2 className="text-2xl font-bold text-slate-800 mb-3">Continue where you left off?</h2>
                                <p className="text-base text-slate-600 mb-8 max-w-md">
                                    You have {draftOffer.edit ? <>unfinished changes to <strong>{draftOffer.edit.target.fileName}</strong></> : <>an unfinished timetable setup{draftOffer.data.schoolName ? <> for <strong>{draftOffer.data.schoolName}</strong></> : ''}</>},
                                    saved {new Date(draftOffer.savedAt).toLocaleString([], { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })} at
                                    step {draftOffer.step || 1} ({STEP_NAMES[(draftOffer.step || 1) - 1]}).
                                </p>
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <Button variant="footerSolid" className="h-11 px-6" onClick={resumeDraft}>Resume</Button>
                                    <Button variant="outline" className="h-11 px-6" onClick={startNew}>Start new</Button>
                                </div>
                            </CardContent>
                        </Card>
                    ) : (
                        /* WIZARD SCREEN */
                        <React.Fragment>
                        <input ref={fileInputRef} type="file" accept=".json,application/json" className="hidden" onChange={loadSetupFile} aria-hidden="true" tabIndex={-1} />
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 flex flex-col">
                            <CardHeader className="border-b border-slate-200 bg-slate-50 rounded-t-xl px-6 py-6 sm:px-10 z-10 relative">
                                <div className="flex items-start justify-between gap-4">
                                    <div className="min-w-0">
                                        <h2 ref={stepHeadingRef} tabIndex={-1} className="text-2xl font-bold text-slate-900 focus:outline-none">
                                            <span className="sr-only">Step {step} of {LAST_STEP}: </span>{STEP_NAMES[step - 1]}
                                        </h2>
                                        <p className="text-sm text-slate-600 mt-1">{editing && step === LAST_STEP ? 'Check the changes, then update the timetable.' : STEP_INFO[step - 1]}</p>
                                    </div>
                                </div>

                                {/* Progress: one segment per step */}
                                <div className="mt-5 flex gap-1.5" role="progressbar" aria-label="Wizard progress"
                                    aria-valuemin={1} aria-valuemax={LAST_STEP} aria-valuenow={step} aria-valuetext={`Step ${step} of ${LAST_STEP}: ${STEP_NAMES[step - 1]}`}>
                                    {STEP_NAMES.map((name, i) => i + 1).map(s => (
                                        <div key={s} className="h-2 flex-1 rounded-full bg-slate-200 overflow-hidden">
                                            {/* The current step's segment moves after the others have finished, so the bar fills (or empties) in order. */}
                                            <div className={`h-full rounded-full transition-all duration-300 ease-out ${s < step ? 'w-full bg-brand-dark' : s === step ? 'w-1/2 bg-brand-green' : 'w-0'}`}
                                                style={{ transitionDelay: s === step ? '300ms' : '0ms' }}></div>
                                        </div>
                                    ))}
                                </div>
                                <ol aria-label="Steps" className="mt-2 grid grid-cols-5 gap-1.5">
                                    {STEP_NAMES.map((name, i) => i + 1).map(s => (
                                        <li key={s} aria-current={step === s ? "step" : undefined} className="min-w-0">
                                            {s < step ? (
                                                <button type="button" onClick={() => goToStep(s)}
                                                    className="inline-flex items-center gap-1 text-[11px] font-semibold uppercase tracking-wider text-brand-dark hover:underline rounded focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950">
                                                    <CheckIcon />
                                                    <span className="truncate">{STEP_NAMES[s - 1]}</span>
                                                    <span className="sr-only"> (done, go back)</span>
                                                </button>
                                            ) : (
                                                <span className={`block truncate text-[11px] font-semibold uppercase tracking-wider ${s === step ? 'text-slate-900' : 'text-slate-500'}`}>
                                                    {STEP_NAMES[s - 1]}
                                                    <span className="sr-only">{s === step ? ' (current step)' : ''}</span>
                                                </span>
                                            )}
                                        </li>
                                    ))}
                                </ol>
                            </CardHeader>

                            <CardContent className="p-6 sm:p-10 min-h-[400px] bg-white relative flex-1">
                                {(() => {
                                    const problems = listProblems();
                                    if (!problems.length) return null;
                                    return (
                                        <div role="alert" className="mb-6 bg-red-50 border border-red-200 p-4 rounded-lg text-sm text-red-900 animate-pop">
                                            <p className="font-semibold mb-2 flex items-center gap-2">
                                                <AlertTriangleIcon className="w-4 h-4 text-red-600" aria-hidden="true" />
                                                {problems.length === 1 ? '1 thing needs fixing' : `${problems.length} things need fixing`} before you continue:
                                            </p>
                                            <ul className="list-disc pl-6 space-y-1">
                                                {(showAllProblems ? problems : problems.slice(0, 6)).map((item, i) => (
                                                    <li key={i}>
                                                        {item.targetId
                                                            ? <button type="button" className="underline text-left hover:text-red-700" onClick={() => goToProblem(item)}>{item.text}</button>
                                                            : item.text}
                                                    </li>
                                                ))}
                                            </ul>
                                            {problems.length > 6 && (
                                                <button type="button" onClick={() => setShowAllProblems(prev => !prev)} className="mt-2 ml-6 text-xs font-semibold underline hover:text-red-700">
                                                    {showAllProblems ? 'Show fewer' : `Show all ${problems.length}`}
                                                </button>
                                            )}
                                        </div>
                                    );
                                })()}
                                {step === STEP.SCHEDULE && renderStep1()}
                                {step === STEP.CLASSES && renderClassesStep()}
                                {step === STEP.SPECIALISTS && renderSpecialistsStep()}
                                {step === STEP.ACTIVITIES && renderActivitiesStep()}
                                {step === LAST_STEP && generationError && (
                                    <div role="alert" className="mb-6 bg-red-50 border border-red-200 p-4 rounded-lg flex items-start gap-3 text-sm text-red-900 animate-pop">
                                        <AlertTriangleIcon className="w-5 h-5 text-red-600 shrink-0 mt-0.5" />
                                        <div className="flex-1">
                                            <p className="font-semibold mb-1">The timetable wasn't generated</p>
                                            <p className="whitespace-pre-line leading-relaxed">{generationError}</p>
                                        </div>
                                        <Button variant="outline" onClick={handleSubmit} className="shrink-0">Try again</Button>
                                    </div>
                                )}
                                {step === LAST_STEP && renderSummaryStep()}
                            </CardContent>

                            <CardFooter className="flex items-start justify-between bg-slate-50 rounded-b-xl border-t border-slate-200 p-6 sm:px-10 h-28 pt-8 shrink-0">
                                <Button variant="outline" onClick={handleBack} disabled={step === STEP.SCHEDULE}>
                                    Back
                                </Button>

                                {step < LAST_STEP && (
                                    <Button variant="default" onClick={handleNext}>Next: {STEP_NAMES[step]}</Button>
                                )}
                            </CardFooter>
                        </Card>
                        </React.Fragment>
                    )}

                    {/* Toast: always present so screen readers announce what appears in it */}
                    <div aria-live="polite" className="fixed top-4 inset-x-0 z-50 flex justify-center px-4 pointer-events-none">
                        {toast && (
                            <div role="status" className={`pointer-events-auto max-w-lg flex items-start gap-3 rounded-lg shadow-lg px-4 py-2.5 text-sm animate-pop ${
                                toast.tone === 'error' ? 'bg-red-700 text-white' : toast.tone === 'ok' ? 'bg-brand-dark text-white' : 'bg-slate-800 text-white'}`}>
                                {toast.tone === 'info' && <CheckIcon />}
                                <span className="flex-1">{toast.text}</span>
                                {toast.tone !== 'info' && (
                                    <button type="button" onClick={() => setToast(null)} className="text-xs font-semibold underline shrink-0">Dismiss</button>
                                )}
                            </div>
                        )}
                    </div>

                    {/* SUITE TAG */}
                    <div className="mt-12 mb-4 text-[11px] font-medium text-brand-dark tracking-widest text-center uppercase">
                        A Sydney Catholic Schools Curriculum Tool - 2026
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

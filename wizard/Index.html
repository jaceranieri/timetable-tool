<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Configuration Wizard</title>
    <!-- Pinned versions, so a new release of a library can't change or break the wizard. -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Figtree', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif']
                    },
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        brand: {
                            green: "#00b268", /* Original Brand Green for accents/logos */
                            dark: "#007A48",  /* WCAG AA Compliant Green for Buttons with white text */
                            bg: "#f4f7f9"
                        },
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        destructive: {
                            DEFAULT: "hsl(var(--destructive))",
                            foreground: "hsl(var(--destructive-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
        }
        body { background-color: #f8fafc; color: hsl(var(--foreground)); font-family: Figtree, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

        /* Custom scrollbar for lists */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }

        /* Microanimations */
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-step { animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.97) translateY(5px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes successPop {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-success { animation: successPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @media (prefers-reduced-motion: reduce) {
            .animate-step, .animate-pop, .animate-success, .animate-spin, .animate-pulse { animation: none; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-12 pb-8 px-4 sm:px-8">
    <div id="root" class="w-full max-w-4xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- BASE UI COMPONENTS ---
        const Card = ({ children, className = "" }) => (
            <div className={`rounded-xl border border-slate-200 bg-white text-slate-950 shadow-sm ${className}`}>{children}</div>
        );
        const CardHeader = ({ children, className = "" }) => <div className={`flex flex-col space-y-1.5 p-6 ${className}`}>{children}</div>;
        const CardContent = ({ children, className = "" }) => <div className={`p-6 pt-0 ${className}`}>{children}</div>;
        const CardFooter = ({ children, className = "" }) => <div className={`flex items-center p-6 pt-0 ${className}`}>{children}</div>;

        const Label = ({ children, className = "", htmlFor }) => (
            <label htmlFor={htmlFor} className={`text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 ${className}`}>{children}</label>
        );

        // A field's error is shown inside it and read out with it (aria-describedby).
        const errorIdFor = (id, error) => (error && id ? `${id}-error` : undefined);

        const Input = ({ className = "", error, id, ...props }) => (
            <div className="relative w-full flex items-center">
                <input id={id} aria-invalid={error ? true : undefined} aria-describedby={errorIdFor(id, error)} className={`flex h-10 w-full rounded-md border ${error ? 'border-red-500 pr-[80px] ring-1 ring-red-500/20' : 'border-slate-200'} bg-white px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 transition-shadow ${className}`} {...props} />
                {error && (
                    <div className="absolute right-2 flex items-center gap-1 text-[11px] font-medium text-red-600 bg-white px-1 pointer-events-none animate-pop">
                        <AlertCircleIcon className="w-3.5 h-3.5" aria-hidden="true" />
                        <span id={errorIdFor(id, error)}>{error}</span>
                    </div>
                )}
            </div>
        );

        const Select = ({ className = "", error, id, children, ...props }) => (
            <div className="relative w-full flex items-center">
                <select id={id} aria-invalid={error ? true : undefined} aria-describedby={errorIdFor(id, error)} className={`flex h-10 w-full appearance-none rounded-md border ${error ? 'border-red-500 pr-[96px] ring-1 ring-red-500/20' : 'border-slate-200 pr-9'} bg-white pl-3 py-2 text-sm ring-offset-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 transition-shadow ${className}`} {...props}>
                    {children}
                </select>
                {!error && (
                    <ChevronDownIcon className="w-4 h-4 text-slate-500 absolute right-3 pointer-events-none" />
                )}
                {error && (
                    <div className="absolute right-7 flex items-center gap-1 text-[11px] font-medium text-red-600 bg-white px-1 pointer-events-none animate-pop">
                        <AlertCircleIcon className="w-3.5 h-3.5" aria-hidden="true" />
                        <span id={errorIdFor(id, error)}>{error}</span>
                    </div>
                )}
            </div>
        );

        const Button = ({ children, variant = "default", className = "", ...props }) => {
            const variants = {
                default: "bg-slate-900 text-slate-50 hover:bg-slate-900/90",
                destructive: "bg-red-600 text-slate-50 hover:bg-red-700",
                bin: "bg-slate-700 text-slate-100 hover:bg-red-600 hover:text-white shadow-sm",
                outline: "border border-slate-200 bg-white hover:bg-slate-100 hover:text-slate-900",
                brand: "bg-brand-dark text-white hover:bg-[#00663C] shadow-sm",
                ghost: "hover:bg-slate-100 hover:text-slate-900",
                footerOutline: "border border-slate-300 text-slate-700 hover:bg-slate-100 shadow-sm",
                footerSolid: "bg-brand-dark text-white hover:bg-[#00663C] shadow-md font-semibold",
            };
            return (
                <button type="button" className={`inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-white transition-all duration-200 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-10 px-4 py-2 ${variants[variant] || variants.default} ${className}`} {...props}>
                    {children}
                </button>
            );
        };

        const DotsIcon = () => <svg className="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>;

        // A "..." button with a short menu. Arrow keys move through the items;
        // Escape or a click elsewhere closes it.
        const MoreMenu = ({ label, items, className = "", icon, boxed }) => {
            const [open, setOpen] = useState(false);
            const buttonRef = useRef(null);
            const menuRef = useRef(null);
            useEffect(() => {
                if (!open) return;
                const first = menuRef.current && menuRef.current.querySelector('[role="menuitem"]');
                if (first) first.focus();
                const closeOnOutsideClick = (e) => {
                    if (menuRef.current && !menuRef.current.contains(e.target) && !buttonRef.current.contains(e.target)) setOpen(false);
                };
                document.addEventListener('mousedown', closeOnOutsideClick);
                return () => document.removeEventListener('mousedown', closeOnOutsideClick);
            }, [open]);
            const onKeyDown = (e) => {
                const entries = [...menuRef.current.querySelectorAll('[role="menuitem"]')];
                const index = entries.indexOf(document.activeElement);
                if (e.key === 'Escape') { e.preventDefault(); setOpen(false); buttonRef.current.focus(); }
                else if (e.key === 'ArrowDown') { e.preventDefault(); entries[(index + 1) % entries.length].focus(); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); entries[(index - 1 + entries.length) % entries.length].focus(); }
                else if (e.key === 'Tab') setOpen(false);
            };
            return (
                <div className={`relative ${className}`}>
                    <button ref={buttonRef} type="button" aria-label={label} title={label} aria-haspopup="menu" aria-expanded={open}
                        onClick={() => setOpen(prev => !prev)}
                        className={`inline-flex items-center justify-center rounded-md transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 ${boxed
                            ? `w-10 h-10 border shadow-sm ${open ? 'border-slate-400 bg-slate-100 text-slate-900' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-100 hover:text-slate-900'}`
                            : 'w-9 h-9 text-slate-600 hover:bg-slate-200/70 hover:text-slate-900'}`}>
                        {icon || <DotsIcon />}
                    </button>
                    {open && (
                        <div ref={menuRef} role="menu" aria-label={label} onKeyDown={onKeyDown}
                            className="absolute right-0 top-full mt-1 z-50 w-64 bg-white border border-slate-200 rounded-lg shadow-xl py-1 animate-pop">
                            {items.map(item => (
                                <button key={item.label} type="button" role="menuitem" tabIndex={-1}
                                    onClick={() => { setOpen(false); item.onSelect(); }}
                                    className="w-full text-left px-3 py-2 text-sm text-slate-800 hover:bg-slate-100 focus:bg-slate-100 focus:outline-none">
                                    <span className="font-medium">{item.label}</span>
                                    {item.hint && <span className="block text-xs text-slate-600">{item.hint}</span>}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // The logo: a mini timetable, three days of lesson blocks on a green tile.
        const LogoMark = () => (
            <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
                <defs>
                    <linearGradient id="logo-tile" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stopColor="#00C774" />
                        <stop offset="1" stopColor="#00663C" />
                    </linearGradient>
                </defs>
                <rect width="56" height="56" rx="16" fill="url(#logo-tile)" />
                <rect x="11" y="11" width="9" height="15" rx="3" fill="#FFFFFF" />
                <rect x="11" y="29" width="9" height="16" rx="3" fill="#FFFFFF" fillOpacity="0.45" />
                <rect x="23.5" y="11" width="9" height="8" rx="3" fill="#FDE68A" />
                <rect x="23.5" y="22" width="9" height="23" rx="3" fill="#FFFFFF" fillOpacity="0.8" />
                <rect x="36" y="11" width="9" height="20" rx="3" fill="#FFFFFF" fillOpacity="0.6" />
                <rect x="36" y="34" width="9" height="11" rx="3" fill="#FFFFFF" />
            </svg>
        );
        const MenuIcon = () => <svg className="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>;
        const PlusIcon = ({className}) => <svg className={className || "w-4 h-4"} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
        const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
        const CheckIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
        const CheckCircleIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const AlertTriangleIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
        const ClockIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const CalendarIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const ActivityIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const ChevronDownIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;
        const ChevronUpIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>;
        const BellIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>;
        const CoffeeIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" y1="2" x2="6" y2="4"></line><line x1="10" y1="2" x2="10" y2="4"></line><line x1="14" y1="2" x2="14" y2="4"></line></svg>;
        const LayersIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 12 12 17 22 12"></polyline><polyline points="2 17 12 22 22 17"></polyline></svg>;
        const UsersIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>;
        const StarIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>;
        const AlertCircleIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const PencilIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path><path d="m15 5 4 4"></path></svg>;

        // Pastel palette offered in the class colour swatch picker (also used
        // to auto-assign a default colour to newly created classes), ordered
        // warm -> cool. 15 presets fill a 4x4 popover grid, with the 16th
        // (bottom-right) cell reserved for the custom colour picker.
        const CLASS_COLOR_PALETTE = [
            '#FFADAD', '#FBC4AB', '#FFD6A5', '#FFE5B4', '#FDFFB6',
            '#CAFFBF', '#C1FFD7', '#D0F4DE', '#9BF6FF', '#C4FAF8',
            '#A0C4FF', '#BDB2FF', '#E4C1F9', '#FFC6FF', '#FFCFE0'
        ];

        // Setup rules shared with the server (validateConfig in Code.gs),
        // which checks the same things again. Keep the two in step.
        const SLOT_MINUTES = 5;
        const MAX_CYCLE_WEEKS = 10;
        const MAX_NAME_LENGTH = 90;
        const MAX_SCHOOL_NAME_LENGTH = 100;
        const RESERVED_TAB_NAMES = ['data', 'template', 'overview', 'spec_template', 'start here'];

        // Short message for a class or specialist name that can't be used as
        // a tab name, or '' if it's fine. Class names can't contain an
        // apostrophe because the OVERVIEW tab looks class tabs up by name.
        const getNameError = (name, isClass) => {
            const trimmed = name.trim();
            const lower = trimmed.toLowerCase();
            if (!trimmed) return "Required";
            if (trimmed.startsWith('=')) return "Can't start with =";
            if (trimmed.length > MAX_NAME_LENGTH) return "Too long";
            if (isClass ? /[\/\\?*\[\]:']/.test(trimmed) : /[\/\\?*\[\]:]/.test(trimmed)) return isClass ? "No / \\ ? * [ ] : '" : "No / \\ ? * [ ] :";
            if (isClass && (RESERVED_TAB_NAMES.includes(lower) || lower.startsWith('spec_'))) return "Reserved name";
            if (!isClass && lower === 'template') return "Reserved name";
            return "";
        };

        // Names (lower-cased) that appear more than once in a list.
        const findDuplicates = (names) => {
            const counts = {};
            names.forEach(n => { const key = n.trim().toLowerCase(); if (key) counts[key] = (counts[key] || 0) + 1; });
            return new Set(Object.keys(counts).filter(key => counts[key] > 1));
        };

        const isOnSlotGrid = (timeStr) => {
            if (!timeStr) return false;
            const [hours, minutes] = timeStr.split(':').map(Number);
            return (hours * 60 + minutes) % SLOT_MINUTES === 0;
        };

        const AMADEUS_ACTIVITY_NAME = 'Amadeus - Tutorials';
        // Every class needs its teacher's name for compliance, so stand-ins
        // are refused (the same rule as TEACHER_PLACEHOLDER in Code.gs).
        const TEACHER_PLACEHOLDER = /^(tbc|tba|tbd|n\/?a|none|unknown|teacher|[-?.\s]*)$/i;
        const getTeacherError = (teacher) => {
            const trimmed = teacher.trim();
            if (!trimmed) return "Required";
            if (TEACHER_PLACEHOLDER.test(trimmed)) return "Enter their name";
            if (trimmed.startsWith('=')) return "Can't start with =";
            return "";
        };

        // A class named after a colour starts with that colour from the palette
        // ("Kindergarten Blue" is blue), until a colour is picked for it.
        const COLOUR_WORDS = [
            [['red', 'scarlet', 'crimson', 'ruby', 'cherry'], '#FFADAD'],
            [['coral', 'peach', 'salmon'], '#FBC4AB'],
            [['orange', 'amber', 'tangerine', 'bronze', 'copper'], '#FFD6A5'],
            [['apricot', 'cream', 'sand', 'honey'], '#FFE5B4'],
            [['gold', 'golden', 'yellow', 'lemon', 'sun', 'sunshine'], '#FDFFB6'],
            [['green', 'lime', 'emerald', 'olive', 'forest'], '#CAFFBF'],
            [['jade', 'mint'], '#C1FFD7'],
            [['sage'], '#D0F4DE'],
            [['aqua', 'turquoise', 'teal', 'cyan'], '#9BF6FF'],
            [['sky', 'ice'], '#C4FAF8'],
            [['blue', 'navy', 'azure', 'sapphire', 'cobalt', 'royal'], '#A0C4FF'],
            [['purple', 'violet', 'indigo', 'plum', 'grape'], '#BDB2FF'],
            [['lilac', 'lavender', 'mauve'], '#E4C1F9'],
            [['pink', 'magenta', 'fuchsia'], '#FFC6FF'],
            [['rose', 'blush'], '#FFCFE0']
        ];
        const colourForName = (name) => {
            const words = String(name || '').toLowerCase().match(/[a-z]+/g) || [];
            for (let i = words.length - 1; i >= 0; i--) {
                const match = COLOUR_WORDS.find(([names]) => names.includes(words[i]));
                if (match) return match[1];
            }
            return null;
        };
        const SETUP_FILE_TYPE = 'timetable-tool-setup';
        const STEP_NAMES = ['Core Schedule', 'Grades', 'Staff', 'Summary'];
        const STEP_INFO = [
            "Your school's name, bell times and breaks.",
            "How many classes each grade has, and how many weeks its timetable runs before repeating.",
            "Class names and teachers, specialist teachers and extra-curricular activities.",
            "Check everything, then generate the timetable."
        ];

        // Shown in turn while the timetable is generated, between reminders of
        // how long it takes.
        const GENERATING_QUIPS = [
            "Asking the photocopier nicely. It said no.",
            "Finding the last clean mug in the staffroom...",
            "Writing \"see me\" next to the clashes...",
            "Rounding up the specialists. Has anyone seen the music teacher?",
            "Colour-coding with the dedication of a Kindy teacher...",
            "Checking every class has enough Creative Arts. And glue sticks.",
            "Making sure Friday afternoon sport isn't double-booked...",
            "Taking the roll: all classes present.",
            "Reminding Year 6 that the timetable is not a suggestion.",
            "Laminating... just kidding, that's next week's job.",
            "Hiding the good whiteboard markers from everyone else...",
            "Counting down the minutes to recess duty. We mean teaching minutes."
        ];
        const DEFAULT_GRADES = [
            { id: "k", name: "Kindergarten" },
            { id: "y1", name: "Year 1" },
            { id: "y2", name: "Year 2" },
            { id: "y3", name: "Year 3" },
            { id: "y4", name: "Year 4" },
            { id: "y5", name: "Year 5" },
            { id: "y6", name: "Year 6" }
        ];

        let idCounter = 0;
        const newId = () => `id-${Date.now().toString(36)}-${(idCounter++).toString(36)}`;

        // The setup a new wizard starts with.
        const makeInitialData = () => ({
            schoolName: "",
            schoolStart: "08:30",
            schoolEnd: "15:15",
            breaks: [
                { id: 1, name: "Recess", start: "10:30", end: "11:00" },
                { id: 2, name: "Lunch", start: "13:00", end: "13:45" }
            ],
            klas: [
                { id: 10, name: "English" },
                { id: 20, name: "Mathematics" },
                { id: 30, name: "Religion" },
                { id: 40, name: "Science & Tech" },
                { id: 50, name: "HSIE" },
                { id: 60, name: "PDHPE" },
                { id: 70, name: "Creative Arts" },
                { id: 80, name: "Non-Curricular" }
            ],
            grades: DEFAULT_GRADES.map(g => ({ ...g, classes: 2, cycle: 1 })),
            staffing: [
                { id: 101, gradeId: "k", className: "Kindergarten Blue", teacher: "", color: colourForName("Kindergarten Blue") },
                { id: 102, gradeId: "k", className: "Kindergarten Red", teacher: "", color: colourForName("Kindergarten Red") },
                { id: 103, gradeId: "y1", className: "Year 1 Gold", teacher: "", color: colourForName("Year 1 Gold") },
                { id: 104, gradeId: "y1", className: "Year 1 Green", teacher: "", color: colourForName("Year 1 Green") },
                { id: 105, gradeId: "y2", className: "Year 2 Amber", teacher: "", color: colourForName("Year 2 Amber") },
                { id: 106, gradeId: "y2", className: "Year 2 Jade", teacher: "", color: colourForName("Year 2 Jade") }
            ],
            specialists: [
                { id: 301, name: "", kla: "", cycle: 1 } // Initial empty template
            ],
            activities: [
                { id: 201, name: "Assembly" },
                { id: 202, name: "Library" },
                // Amadeus runs in Years 3-6 in every school, so it can't be
                // renamed or removed (the name must match TEMPLATE!B21).
                { id: 203, name: AMADEUS_ACTIVITY_NAME, locked: true }
            ]
        });

        // Rows left completely blank are skipped rather than reported.
        const isBlankClass = (s) => !s.className.trim() && !s.teacher.trim();
        const isBlankSpecialist = (s) => !s.name.trim() && !s.kla;

        // The classes that will be generated, grade by grade.
        const getClassesToGenerate = (data) => {
            const classes = [];
            data.grades.filter(g => g.classes > 0).forEach(g => {
                data.staffing
                    .filter(s => s.gradeId === g.id && !isBlankClass(s))
                    .forEach(s => classes.push({ ...s, grade: g }));
            });
            return classes;
        };
        const getSpecialistsToGenerate = (data) => data.specialists.filter(s => !isBlankSpecialist(s));

        // The flat name/value list sent to generateTimetable. The server keeps
        // it in the timetable's DATA tab (RawData_JSON), and setup files hold
        // the same list, so either can be loaded back with setupFromVariables.
        const buildExportVariables = (data) => {
            const variables = [];
            const add = (name, value) => variables.push({ name, value });
            add('SchoolName', data.schoolName.trim());
            add('SchoolStart', data.schoolStart);
            add('SchoolEnd', data.schoolEnd);
            data.breaks.forEach((b, i) => {
                add(`Break_${i+1}_Name`, b.name);
                add(`Break_${i+1}_Start`, b.start);
                add(`Break_${i+1}_End`, b.end);
            });
            data.klas.forEach((k, i) => add(`KLA_${i+1}_Name`, k.name));
            getSpecialistsToGenerate(data).forEach((s, i) => {
                add(`Specialist_${i+1}_Name`, s.name);
                add(`Specialist_${i+1}_KLA`, s.kla);
                add(`Specialist_${i+1}_Cycle`, s.cycle || 1);
            });
            getClassesToGenerate(data).forEach((s, i) => {
                add(`Class_${i+1}_Name`, s.className);
                add(`Class_${i+1}_Teacher`, s.teacher.trim());
                add(`Class_${i+1}_Grade`, s.grade.name);
                add(`Class_${i+1}_Cycle`, s.grade.cycle);
                add(`Class_${i+1}_Color`, s.color || '');
            });
            data.activities.filter(a => a.name.trim()).forEach((a, i) => add(`Activity_${i+1}_Name`, a.name));
            return variables;
        };

        const clampCycle = (value) => Math.min(MAX_CYCLE_WEEKS, Math.max(1, parseInt(value, 10) || 1));

        // The wizard's setup from a name/value list (a setup file, or a
        // timetable's RawData_JSON). Grades the wizard doesn't list are added
        // after Year 6.
        const setupFromVariables = (exportVariables) => {
            const values = {};
            exportVariables.forEach(item => { if (item && item.name) values[item.name] = item.value; });
            const text = (name) => (values[name] === undefined || values[name] === null ? '' : String(values[name]));
            const list = (prefix, read) => {
                const items = [];
                for (let i = 1; values[`${prefix}_${i}_Name`] !== undefined; i++) items.push(read(i));
                return items;
            };
            const defaults = makeInitialData();

            const grades = DEFAULT_GRADES.map(g => ({ ...g, classes: 0, cycle: 1 }));
            const staffing = [];
            list('Class', i => ({
                name: text(`Class_${i}_Name`).trim(),
                teacher: text(`Class_${i}_Teacher`).trim(),
                grade: text(`Class_${i}_Grade`).trim() || 'Other',
                cycle: clampCycle(values[`Class_${i}_Cycle`]),
                color: text(`Class_${i}_Color`).trim()
            })).filter(c => c.name).forEach(c => {
                let grade = grades.find(g => g.name.toLowerCase() === c.grade.toLowerCase());
                if (!grade) {
                    grade = { id: newId(), name: c.grade, classes: 0, cycle: 1 };
                    grades.push(grade);
                }
                grade.classes++;
                grade.cycle = c.cycle;
                staffing.push({
                    id: newId(),
                    gradeId: grade.id,
                    className: c.name,
                    teacher: c.teacher,
                    color: c.color || colourForName(c.name) || CLASS_COLOR_PALETTE[staffing.length % CLASS_COLOR_PALETTE.length]
                });
            });

            const klas = list('KLA', i => ({ id: newId(), name: text(`KLA_${i}_Name`).trim() })).filter(k => k.name);
            const activities = list('Activity', i => ({ id: newId(), name: text(`Activity_${i}_Name`).trim() }))
                .filter(a => a.name)
                .map(a => a.name.toLowerCase() === AMADEUS_ACTIVITY_NAME.toLowerCase()
                    ? { ...a, name: AMADEUS_ACTIVITY_NAME, locked: true }
                    : a);
            if (!activities.some(a => a.locked)) activities.push({ id: newId(), name: AMADEUS_ACTIVITY_NAME, locked: true });

            return {
                schoolName: text('SchoolName').trim(),
                schoolStart: text('SchoolStart') || defaults.schoolStart,
                schoolEnd: text('SchoolEnd') || defaults.schoolEnd,
                breaks: list('Break', i => ({
                    id: newId(),
                    name: text(`Break_${i}_Name`),
                    start: text(`Break_${i}_Start`),
                    end: text(`Break_${i}_End`)
                })),
                klas: klas.length ? klas : defaults.klas,
                grades: grades,
                staffing: staffing,
                specialists: list('Specialist', i => ({
                    id: newId(),
                    name: text(`Specialist_${i}_Name`).trim(),
                    kla: text(`Specialist_${i}_KLA`).trim(),
                    cycle: clampCycle(values[`Specialist_${i}_Cycle`])
                })).filter(s => s.name),
                activities: activities
            };
        };

        // For each specialist, the grades whose cycle isn't a multiple of
        // theirs: the sync can't line those lessons up week by week.
        const findCycleMismatches = (data) => {
            const classes = getClassesToGenerate(data);
            const grades = data.grades.filter(g => classes.some(c => c.gradeId === g.id));
            const mismatches = {};
            getSpecialistsToGenerate(data).forEach(s => {
                const cycle = s.cycle || 1;
                const misfits = grades.filter(g => g.cycle % cycle !== 0);
                if (misfits.length) mismatches[s.id] = misfits;
            });
            return mismatches;
        };

        const describeCycleMismatch = (specialist, grades) => {
            const cycle = specialist.cycle || 1;
            // Grouped by cycle: "Kindergarten (3-week cycle); Year 1, Year 2 (1-week cycle)".
            const cycles = [...new Set(grades.map(g => g.cycle))];
            const gradeList = cycles.map(c => `${grades.filter(g => g.cycle === c).map(g => g.name).join(', ')} (${c}-week cycle)`).join('; ');
            return `${specialist.name.trim() || 'This specialist'}'s ${cycle}-week cycle doesn't fit ${gradeList}. ` +
                `A class's cycle needs to be a multiple of the specialist's (${cycle}, ${cycle * 2}, ... weeks) for the lessons to line up; ` +
                `otherwise the sync puts lessons from different weeks together.`;
        };

        // Roughly how long generating takes, from the load test (28 classes,
        // 6 specialists: 93 seconds): setup, building the first tab of each
        // cycle, copying the rest, and each specialist's clash check.
        const estimateGeneration = (data) => {
            const classes = getClassesToGenerate(data);
            const specialists = getSpecialistsToGenerate(data);
            const firstTabs = new Set(classes.map(c => c.grade.cycle)).size +
                new Set(specialists.map(s => s.cycle || 1)).size;
            const seconds = 10 + 11 * firstTabs + 0.7 * (classes.length + specialists.length) + 3 * specialists.length;
            const halfMinutes = Math.max(2, Math.round(seconds / 30));
            const minutes = Math.floor(halfMinutes / 2) + (halfMinutes % 2 ? '½' : '');
            return {
                classTabs: classes.length,
                specialistTabs: specialists.length,
                seconds: Math.round(seconds),
                text: seconds < 45 ? 'under a minute' : `about ${minutes} minute${halfMinutes > 2 ? 's' : ''}`,
                short: seconds < 45 ? 'Under 1 min' : `About ${minutes} min`
            };
        };

        // Rows copied from a spreadsheet: class name, then teacher (cells are
        // tab-separated when pasted). A heading row is dropped.
        const parsePastedClasses = (text) => {
            const rows = String(text || '').split(/\r?\n/)
                .map(line => line.split('\t').map(cell => cell.trim()))
                .filter(cells => cells.some(Boolean));
            if (rows.length && /^class(\s*name)?$/i.test(rows[0][0])) rows.shift();
            return rows.map(cells => ({ className: cells[0] || '', teacher: cells[1] || '' }));
        };

        const App = () => {
            const [step, setStep] = useState(1);

            // Real-time Generation & Polling States
            const [isGenerating, setIsGenerating] = useState(false);
            const [loadingProgress, setLoadingProgress] = useState(0);
            const [loadingMessage, setLoadingMessage] = useState("");
            const [activeJobId, setActiveJobId] = useState(null);
            const [logs, setLogs] = useState([]);
            const [elapsedSeconds, setElapsedSeconds] = useState(0);

            const [isSuccess, setIsSuccess] = useState(false);
            const [activeGradeTab, setActiveGradeTab] = useState(null);
            const [colorPickerFor, setColorPickerFor] = useState(null);
            const [colorPickerPos, setColorPickerPos] = useState({ top: 0, left: 0 });
            const colorTriggerRefs = useRef({});

            // Keep the open colour popover glued to its trigger swatch as the
            // page or any nested scroll container (e.g. the class list) scrolls.
            useEffect(() => {
                if (colorPickerFor === null) return;
                const reposition = () => {
                    const el = colorTriggerRefs.current[colorPickerFor];
                    if (!el) return;
                    const rect = el.getBoundingClientRect();
                    setColorPickerPos({ top: rect.bottom + 6, left: rect.left });
                };
                reposition();
                const closeOnEscape = (e) => {
                    if (e.key !== 'Escape') return;
                    const trigger = colorTriggerRefs.current[colorPickerFor];
                    setColorPickerFor(null);
                    if (trigger) trigger.focus();
                };
                window.addEventListener('scroll', reposition, true);
                window.addEventListener('resize', reposition);
                window.addEventListener('keydown', closeOnEscape);
                return () => {
                    window.removeEventListener('scroll', reposition, true);
                    window.removeEventListener('resize', reposition);
                    window.removeEventListener('keydown', closeOnEscape);
                };
            }, [colorPickerFor]);
            const [generatedUrl, setGeneratedUrl] = useState("");
            const [generationError, setGenerationError] = useState("");

            // App state for wizard data
            const [data, setData] = useState(makeInitialData);
            const dataRef = useRef(data);
            dataRef.current = data;

            const [errors, setErrors] = useState({});
            const [showLogs, setShowLogs] = useState(false);
            const [quipTick, setQuipTick] = useState(0);
            const quipStart = useRef(0);
            useEffect(() => {
                if (!isGenerating) return;
                setQuipTick(0);
                quipStart.current = Math.floor(Math.random() * GENERATING_QUIPS.length);
                const timer = setInterval(() => setQuipTick(prev => prev + 1), 4500);
                return () => clearInterval(timer);
            }, [isGenerating]);
            const logContainerRef = useRef(null);
            const stepHeadingRef = useRef(null);
            const fileInputRef = useRef(null);
            // Short messages at the bottom of the screen ("Draft saved", setup file results).
            const [toast, setToast] = useState(null); // { id, text, tone: 'info' | 'ok' | 'error' }
            const showToast = (text, tone, ms) => setToast({ id: Date.now() + Math.random(), text, tone, ms });
            useEffect(() => {
                if (!toast) return;
                const timer = setTimeout(() => setToast(current => (current && current.id === toast.id ? null : current)), toast.ms || 4000);
                return () => clearTimeout(timer);
            }, [toast]);
            const [pasteFor, setPasteFor] = useState(null); // grade id with the paste box open
            const [pasteText, setPasteText] = useState("");

            // Drafts: the setup is saved for this user (saveDraft in Code.gs) a
            // moment after each change, and offered back when the wizard opens.
            const [draftOffer, setDraftOffer] = useState(null);
            const draftsEnabled = useRef(false); // not until any saved draft has been offered
            const hasServer = typeof google !== 'undefined' && google.script;
            const initialJson = JSON.stringify(makeInitialData());

            useEffect(() => {
                if (!hasServer) return;
                google.script.run
                    .withSuccessHandler((json) => {
                        let draft = null;
                        try { draft = json ? JSON.parse(json) : null; } catch (e) { /* a damaged draft is ignored */ }
                        // Only offered if nothing has been typed in the meantime.
                        if (draft && draft.data && Array.isArray(draft.data.grades) && JSON.stringify(dataRef.current) === initialJson) {
                            setDraftOffer(draft);
                        } else {
                            draftsEnabled.current = true;
                        }
                    })
                    .withFailureHandler(() => { draftsEnabled.current = true; })
                    .loadDraft();
            }, []);

            useEffect(() => {
                if (!hasServer || !draftsEnabled.current || isGenerating || isSuccess) return;
                if (JSON.stringify(data) === initialJson) return; // nothing worth keeping yet
                const timer = setTimeout(() => {
                    const draft = { savedAt: new Date().toISOString(), step: step, data: data };
                    google.script.run
                        .withSuccessHandler((saved) => { if (saved) showToast("Draft saved", 'info', 2000); })
                        .saveDraft(JSON.stringify(draft));
                }, 1500);
                return () => clearTimeout(timer);
            }, [data, step]);

            const resumeDraft = () => {
                draftsEnabled.current = true;
                setData(draftOffer.data);
                setStep(Math.min(4, Math.max(1, Number(draftOffer.step) || 1)));
                setErrors({});
                setActiveGradeTab(null);
                setDraftOffer(null);
            };

            const startNew = () => {
                draftsEnabled.current = true;
                setDraftOffer(null);
                setData(makeInitialData());
                setErrors({});
                setStep(1);
                setActiveGradeTab(null);
                setIsSuccess(false);
                setGeneratedUrl("");
                setGenerationError("");
                setToast(null);
                if (hasServer) google.script.run.clearDraft();
            };

            // Each new step is announced: focus moves to its (visually hidden) heading.
            const firstRender = useRef(true);
            useEffect(() => {
                if (firstRender.current) { firstRender.current = false; return; }
                if (stepHeadingRef.current) stepHeadingRef.current.focus();
            }, [step]);

            useEffect(() => {
                let timerInterval = null;
                let pollInterval = null;

                if (isGenerating) {
                    setElapsedSeconds(0);
                    timerInterval = setInterval(() => {
                        setElapsedSeconds(prev => prev + 1);
                    }, 1000);

                    if (activeJobId) {
                        pollInterval = setInterval(() => {
                            if (typeof google !== 'undefined' && google.script) {
                                google.script.run
                                    .withSuccessHandler((responseJson) => {
                                        if (responseJson) {
                                            try {
                                                const data = JSON.parse(responseJson);
                                                if (data.percent >= 0) {
                                                    setLoadingProgress(data.percent);
                                                    setLoadingMessage(data.status);
                                                    setLogs(prev => {
                                                        if (prev.length === 0 || prev[prev.length - 1].text !== data.status) {
                                                            return [...prev, {
                                                                id: Date.now() + Math.random(),
                                                                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                                                                text: data.status,
                                                                percent: data.percent
                                                            }];
                                                        }
                                                        return prev;
                                                    });
                                                } else if (data.percent === -1) {
                                                    setIsGenerating(false);
                                                    setGenerationError(data.status);
                                                }
                                            } catch (e) {
                                                console.error("Error parsing progress response:", e);
                                            }
                                        }
                                    })
                                    .checkProgress(activeJobId);
                            }
                        }, 1200);
                    }
                }

                return () => {
                    if (timerInterval) clearInterval(timerInterval);
                    if (pollInterval) clearInterval(pollInterval);
                };
            }, [isGenerating, activeJobId]);

            // Auto-scroll activity log to latest entry
            useEffect(() => {
                if (logContainerRef.current) {
                    logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
                }
            }, [logs]);

            const plural = (count, one, many) => `${count} ${count === 1 ? one : many}`;

            // Helper to format elapsed time
            const formatElapsed = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const updateField = (field, val) => {
                setData(prev => ({ ...prev, [field]: val }));
                setErrors(prev => ({ ...prev, [field]: undefined }));
            };

            const addToList = (listKey, newItem) => {
                const itemWithId = { ...newItem, id: Date.now() + Math.random() };
                setData(prev => ({ ...prev, [listKey]: [...prev[listKey], itemWithId] }));
            };

            const updateList = (listKey, index, field, val) => {
                setData(prev => {
                    const list = [...prev[listKey]];
                    list[index] = { ...list[index], [field]: val };
                    if (listKey === 'staffing' && field === 'color') list[index].colorChosen = true;
                    if (listKey === 'staffing' && field === 'className' && !list[index].colorChosen) {
                        list[index].color = colourForName(val) || list[index].color;
                    }
                    return { ...prev, [listKey]: list };
                });
                // The error on the field being edited no longer applies.
                setErrors(prev => {
                    if (listKey === 'staffing' && prev.noClasses) prev = { ...prev, noClasses: undefined };
                    if (!prev[listKey]?.[index]?.[field]) return prev;
                    const listErrors = { ...prev[listKey], [index]: { ...prev[listKey][index], [field]: undefined } };
                    return { ...prev, [listKey]: listErrors };
                });
            };

            const removeFromList = (listKey, id) => {
                setData(prev => ({
                    ...prev,
                    [listKey]: prev[listKey].filter(item => item.id !== id)
                }));
            };

            const validateStep1 = () => {
                let currentErrors = {};
                let isValid = true;

                const schoolName = data.schoolName.trim();
                if (!schoolName) { currentErrors.schoolName = "Required"; isValid = false; }
                else if (schoolName.startsWith('=')) { currentErrors.schoolName = "Can't start with ="; isValid = false; }
                else if (schoolName.length > MAX_SCHOOL_NAME_LENGTH) { currentErrors.schoolName = "Too long"; isValid = false; }

                if (!data.schoolStart) { currentErrors.schoolStart = "Required"; isValid = false; }
                if (!data.schoolEnd) { currentErrors.schoolEnd = "Required"; isValid = false; }

                if (data.schoolStart && !isOnSlotGrid(data.schoolStart)) { currentErrors.schoolStart = "Use 5-min steps"; isValid = false; }
                if (data.schoolEnd && !isOnSlotGrid(data.schoolEnd)) { currentErrors.schoolEnd = "Use 5-min steps"; isValid = false; }

                if (data.schoolStart && data.schoolEnd && data.schoolStart >= data.schoolEnd) {
                    currentErrors.schoolEnd = "Must be after start time";
                    isValid = false;
                }

                let breakErrs = {};
                data.breaks.forEach((b, i) => {
                    breakErrs[i] = {};
                    if (!b.name.trim()) { breakErrs[i].name = "Required"; isValid = false; }
                    if (!b.start) { breakErrs[i].start = "Required"; isValid = false; }
                    if (!b.end) { breakErrs[i].end = "Required"; isValid = false; }

                    if (b.start && !isOnSlotGrid(b.start)) { breakErrs[i].start = "Use 5-min steps"; isValid = false; }
                    if (b.end && !isOnSlotGrid(b.end)) { breakErrs[i].end = "Use 5-min steps"; isValid = false; }

                    if (b.start && b.end && b.start >= b.end) {
                        breakErrs[i].end = "End must be after start";
                        isValid = false;
                    }

                    const overlaps = data.breaks.some((other, j) => j !== i && b.start && b.end && other.start && other.end && b.start < other.end && other.start < b.end);
                    if (overlaps && !breakErrs[i].start) { breakErrs[i].start = "Overlaps a break"; isValid = false; }

                    if (b.start && data.schoolStart && b.start < data.schoolStart) {
                        breakErrs[i].start = "Before school start";
                        isValid = false;
                    }
                    if (b.end && data.schoolEnd && b.end > data.schoolEnd) {
                        breakErrs[i].end = "After school end";
                        isValid = false;
                    }
                });

                if (Object.keys(breakErrs).some(k => Object.keys(breakErrs[k]).length > 0)) {
                    currentErrors.breaks = breakErrs;
                }

                setErrors(currentErrors);
                return isValid;
            };

            const validateStep2 = () => {
                let currentErrors = { grades: {} };
                let isValid = true;

                data.grades.forEach((g, i) => {
                    currentErrors.grades[i] = {};
                    if (g.classes === undefined || g.classes === null || g.classes < 0) { currentErrors.grades[i].classes = "Invalid"; isValid = false; }
                    if (!g.cycle || g.cycle < 1 || g.cycle > MAX_CYCLE_WEEKS) { currentErrors.grades[i].cycle = "1 to 10 weeks"; isValid = false; }
                });

                setErrors(currentErrors);
                return isValid;
            };

            const validateStep3 = () => {
                let currentErrors = { staffing: {}, specialists: {}, activities: {} };
                let isValid = true;
                let firstErrorGradeId = null;
                let firstErrorStaffId = null;

                // Only classes in grades that still have classes are generated,
                // and rows left completely blank are skipped. Every class needs
                // its teacher's name (compliance), not a stand-in like TBC.
                const activeGradeIds = data.grades.filter(g => g.classes > 0).map(g => g.id);
                const classesToGenerate = getClassesToGenerate(data);
                const duplicateClasses = findDuplicates(classesToGenerate.map(s => s.className));
                const breakNames = data.breaks.map(b => b.name.trim().toLowerCase()).filter(Boolean);
                if (!classesToGenerate.length) { currentErrors.noClasses = true; isValid = false; }

                data.staffing.forEach((s, i) => {
                    currentErrors.staffing[i] = {};
                    if (!activeGradeIds.includes(s.gradeId) || isBlankClass(s)) return;
                    const key = s.className.trim().toLowerCase();
                    const nameError = getNameError(s.className, true)
                        || (duplicateClasses.has(key) ? "Duplicate name" : "")
                        || (breakNames.includes(key) ? "Same as a break" : "");
                    if (nameError) { currentErrors.staffing[i].className = nameError; isValid = false; }
                    const teacherError = getTeacherError(s.teacher);
                    if (teacherError) { currentErrors.staffing[i].teacher = teacherError; isValid = false; }
                    if (Object.keys(currentErrors.staffing[i]).length && !firstErrorGradeId) {
                        firstErrorGradeId = s.gradeId;
                        firstErrorStaffId = s.id;
                    }
                });

                const duplicateSpecialists = findDuplicates(getSpecialistsToGenerate(data).map(s => s.name));
                data.specialists.forEach((s, i) => {
                    currentErrors.specialists[i] = {};
                    if (isBlankSpecialist(s)) return;
                    const nameError = getNameError(s.name, false)
                        || (duplicateSpecialists.has(s.name.trim().toLowerCase()) ? "Duplicate name" : "");
                    if (nameError) { currentErrors.specialists[i].name = nameError; isValid = false; }
                    if (!s.kla) { currentErrors.specialists[i].kla = "Required"; isValid = false; }
                    if (!s.cycle || s.cycle < 1 || s.cycle > MAX_CYCLE_WEEKS) { currentErrors.specialists[i].cycle = "1 to 10 weeks"; isValid = false; }
                });

                data.activities.forEach((a, i) => {
                    currentErrors.activities[i] = {};
                    if (a.name.trim().startsWith('=')) { currentErrors.activities[i].name = "Can't start with ="; isValid = false; }
                });

                setErrors(currentErrors);
                // Class errors only show on their grade's tab, so open it and
                // bring the first class with a problem into view.
                if (firstErrorGradeId) {
                    setActiveGradeTab(firstErrorGradeId);
                    setTimeout(() => {
                        const row = document.getElementById(`class-row-${firstErrorStaffId}`);
                        if (!row) return;
                        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        const field = row.querySelector('[aria-invalid="true"]');
                        if (field) field.focus({ preventScroll: true });
                    }, 50);
                }
                return isValid;
            };

            const handleNext = () => {
                let valid = false;
                if (step === 1) valid = validateStep1();
                if (step === 2) {
                    valid = validateStep2();
                    if (valid) {
                        setData(prev => {
                            let newStaffing = [...prev.staffing];
                            const validGradeIds = prev.grades.map(g => g.id);

                            // Remove staffing entries for grades that were deleted
                            newStaffing = newStaffing.filter(s => validGradeIds.includes(s.gradeId));

                            // Adjust staffing rows per grade based on defined 'classes' count
                            prev.grades.forEach(g => {
                                const existingForGrade = newStaffing.filter(s => s.gradeId === g.id);

                                if (existingForGrade.length < g.classes) {
                                    const toAdd = g.classes - existingForGrade.length;
                                    const startIdx = existingForGrade.length + 1;
                                    for (let i = 0; i < toAdd; i++) {
                                        const className = `${g.name} - ${startIdx + i}`;
                                        newStaffing.push({
                                            id: Date.now() + Math.random(),
                                            gradeId: g.id,
                                            className: className,
                                            teacher: "",
                                            color: colourForName(className) || CLASS_COLOR_PALETTE[newStaffing.length % CLASS_COLOR_PALETTE.length]
                                        });
                                    }
                                } else if (existingForGrade.length > g.classes) {
                                    const toRemove = existingForGrade.length - g.classes;
                                    for (let i = 0; i < toRemove; i++) {
                                        const idToRemove = existingForGrade[existingForGrade.length - 1 - i].id;
                                        newStaffing = newStaffing.filter(s => s.id !== idToRemove);
                                    }
                                }
                            });

                            return { ...prev, staffing: newStaffing };
                        });

                        // Set active tab to first grade that has classes
                        const gradesWithClasses = data.grades.filter(g => g.classes > 0);
                        if (gradesWithClasses.length > 0) {
                            setActiveGradeTab(gradesWithClasses[0].id);
                        }
                    }
                }
                if (step === 3) valid = validateStep3();

                if (valid && step < 4) setStep(step + 1);
            };

            const handleBack = () => {
                setGenerationError("");
                setStep(step - 1);
            };

            // The summary's Edit links.
            const goToStep = (target) => {
                setGenerationError("");
                setStep(target);
            };

            // Every problem on the current step, each linked to its field.
            const listProblems = () => {
                const items = [];
                const add = (text, targetId, gradeId) => items.push({ text, targetId, gradeId });
                if (step === 1) {
                    if (errors.schoolName) add(`School name: ${errors.schoolName}`, 'school-name');
                    if (errors.schoolStart) add(`School start time: ${errors.schoolStart}`, 'school-start');
                    if (errors.schoolEnd) add(`School end time: ${errors.schoolEnd}`, 'school-end');
                    data.breaks.forEach((b, i) => {
                        const e = errors.breaks?.[i] || {};
                        const label = b.name.trim() || `Break ${i + 1}`;
                        if (e.name) add(`${label} name: ${e.name}`, `break-${b.id}-name`);
                        if (e.start) add(`${label} start: ${e.start}`, `break-${b.id}-start`);
                        if (e.end) add(`${label} end: ${e.end}`, `break-${b.id}-end`);
                    });
                }
                if (step === 2) {
                    data.grades.forEach((g, i) => {
                        const e = errors.grades?.[i] || {};
                        if (e.classes) add(`${g.name} classes: ${e.classes}`, `grade-${g.id}-classes`);
                        if (e.cycle) add(`${g.name} cycle length: ${e.cycle}`, `grade-${g.id}-cycle`);
                    });
                }
                if (step === 3) {
                    if (errors.noClasses) add("Every class row is blank. Give at least one class a name.", null);
                    data.grades.forEach(g => {
                        data.staffing.forEach((s, i) => {
                            if (s.gradeId !== g.id) return;
                            const e = errors.staffing?.[i] || {};
                            const position = data.staffing.filter(st => st.gradeId === g.id).indexOf(s) + 1;
                            const label = `${g.name}, class ${position}${s.className.trim() ? ` (${s.className.trim()})` : ''}`;
                            if (e.className) add(`${label} name: ${e.className}`, `class-${s.id}-name`, g.id);
                            if (e.teacher) add(`${label} teacher: ${e.teacher}`, `class-${s.id}-teacher`, g.id);
                        });
                    });
                    data.specialists.forEach((s, i) => {
                        const e = errors.specialists?.[i] || {};
                        const label = `Specialist ${i + 1}${s.name.trim() ? ` (${s.name.trim()})` : ''}`;
                        if (e.name) add(`${label} name: ${e.name}`, `spec-${s.id}-name`);
                        if (e.kla) add(`${label} KLA: ${e.kla}`, `spec-${s.id}-kla`);
                        if (e.cycle) add(`${label} cycle length: ${e.cycle}`, `spec-${s.id}-cycle`);
                    });
                    data.activities.forEach((a, i) => {
                        const e = errors.activities?.[i] || {};
                        if (e.name) add(`Activity "${a.name.trim()}": ${e.name}`, `activity-${a.id}`);
                    });
                }
                return items;
            };

            const goToProblem = (item) => {
                if (item.gradeId) setActiveGradeTab(item.gradeId);
                setTimeout(() => {
                    const field = item.targetId && document.getElementById(item.targetId);
                    if (!field) return;
                    field.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    field.focus({ preventScroll: true });
                }, 50);
            };

            // Replaces a grade's classes with rows pasted from a spreadsheet.
            const applyPaste = (gradeId, rows) => {
                setData(prev => {
                    const existing = prev.staffing.filter(s => s.gradeId === gradeId);
                    const others = prev.staffing.filter(s => s.gradeId !== gradeId);
                    const pasted = rows.map((row, i) => ({
                        id: existing[i] ? existing[i].id : newId(),
                        gradeId: gradeId,
                        className: row.className,
                        teacher: row.teacher,
                        color: colourForName(row.className) || (existing[i] ? existing[i].color : CLASS_COLOR_PALETTE[(others.length + i) % CLASS_COLOR_PALETTE.length])
                    }));
                    return {
                        ...prev,
                        grades: prev.grades.map(g => g.id === gradeId ? { ...g, classes: pasted.length } : g),
                        staffing: others.concat(pasted)
                    };
                });
                // Errors are kept by row position, which has changed.
                setErrors(prev => ({ ...prev, staffing: {}, noClasses: undefined }));
                setPasteFor(null);
                setPasteText("");
            };

            // Setup files: the same name/value list the timetable keeps in its DATA tab.
            const saveSetupFile = () => {
                const file = {
                    type: SETUP_FILE_TYPE,
                    version: 1,
                    savedAt: new Date().toISOString(),
                    exportVariables: buildExportVariables(data)
                };
                const fileName = `${(data.schoolName.trim() || 'Timetable').replace(/[\\/:*?"<>|]/g, '')} - timetable setup.json`;
                const url = URL.createObjectURL(new Blob([JSON.stringify(file, null, 2)], { type: 'application/json' }));
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showToast(`Saved "${fileName}" to your downloads.`, 'ok', 5000);
            };

            const loadSetupFile = (event) => {
                const file = event.target.files && event.target.files[0];
                event.target.value = ""; // so the same file can be chosen again
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        if (!parsed || !Array.isArray(parsed.exportVariables)) throw new Error('Not a setup file');
                        const loaded = setupFromVariables(parsed.exportVariables);
                        setData(loaded);
                        setErrors({});
                        setGenerationError("");
                        setActiveGradeTab(null);
                        setStep(1);
                        const classCount = getClassesToGenerate(loaded).length;
                        const specialistCount = loaded.specialists.length;
                        showToast(`Loaded the setup${loaded.schoolName ? ` for ${loaded.schoolName}` : ''}: ` +
                            `${classCount} ${classCount === 1 ? 'class' : 'classes'} and ${specialistCount} ${specialistCount === 1 ? 'specialist' : 'specialists'}. ` +
                            `Check each step before generating.`, 'ok', 7000);
                    } catch (e) {
                        showToast(`"${file.name}" isn't a timetable setup file. Choose a file saved with "Save setup to a file".`, 'error', 10000);
                    }
                };
                reader.onerror = () => showToast(`"${file.name}" couldn't be read.`, 'error', 10000);
                reader.readAsText(file);
            };

            // Message for a failed generateTimetable call. The server already
            // words its own errors; a timeout comes from Google instead.
            const describeFailure = (error) => {
                const text = String((error && error.message) || error || "").replace(/^((Error|Exception):\s*)+/i, "");
                if (/exceeded maximum execution time/i.test(text)) {
                    return "Generating took longer than Google allows (6 minutes), so it was stopped. " +
                        "The unfinished copy is named \"INCOMPLETE - ...\" in your Drive and can be deleted. " +
                        "Please try again.";
                }
                return text || "Something went wrong while generating the timetable. Please try again.";
            };

            const handleSubmit = () => {
                setGenerationError("");
                const jobId = 'job_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
                setActiveJobId(jobId);
                setShowLogs(false);
                setIsGenerating(true);
                setLoadingProgress(5);

                const initialMsg = "Initializing template duplication...";
                setLoadingMessage(initialMsg);
                setLogs([{
                    id: Date.now(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                    text: initialMsg,
                    percent: 5
                }]);

                const exportVariables = buildExportVariables(data);

                const payloadToSubmit = {
                    jobId: jobId,
                    exportVariables: exportVariables
                };

                // Check environment and invoke backend function
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler((url) => {
                            // The setup is in the timetable now; nothing to resume.
                            google.script.run.clearDraft();
                            setLoadingProgress(100);
                            setLoadingMessage("Finalizing spreadsheet setup...");
                            setLogs(prev => [...prev, {
                                id: Date.now(),
                                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                                text: "Timetable generated successfully!",
                                percent: 100
                            }]);
                            setTimeout(() => {
                                setGeneratedUrl(url);
                                setIsGenerating(false);
                                setIsSuccess(true);
                            }, 800);
                        })
                        .withFailureHandler((error) => {
                            setGenerationError(describeFailure(error));
                            setIsGenerating(false);
                        })
                        .generateTimetable(payloadToSubmit);
                } else {
                    // Local dev simulation with realistic multi-step updates
                    const steps = [
                        { pct: 15, msg: "Opening duplicated spreadsheet..." },
                        { pct: 22, msg: "Populating DATA sheet configurations..." },
                        { pct: 35, msg: "Generating Class 1 of 3: Kindergarten - 1 (Building grid...)" },
                        { pct: 55, msg: "Generating Class 2 of 3: Year 1 - 1 (Applying break slots...)" },
                        { pct: 80, msg: "Generating Class 3 of 3: Year 2 - 1 (Formatting cells...)" },
                        { pct: 95, msg: "Applying conditional formatting rules..." },
                        { pct: 100, msg: "Timetable generation complete!" }
                    ];

                    steps.forEach((step, idx) => {
                        setTimeout(() => {
                            setLoadingProgress(step.pct);
                            setLoadingMessage(step.msg);
                            setLogs(prev => [...prev, {
                                id: Date.now() + idx,
                                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                                text: step.msg,
                                percent: step.pct
                            }]);

                            if (step.pct === 100) {
                                setTimeout(() => {
                                    setGeneratedUrl("https://docs.google.com/spreadsheets/d/dummy-link-for-dev");
                                    setIsGenerating(false);
                                    setIsSuccess(true);
                                }, 600);
                            }
                        }, (idx + 1) * 1200);
                    });
                }
            };

            const timeToMinutes = (timeStr) => {
                if (!timeStr) return 0;
                const [hours, minutes] = timeStr.split(':').map(Number);
                return (hours * 60) + minutes;
            };

            const formatMinutes = (totalMins) => {
                if (totalMins < 0) return "0 min";
                const h = Math.floor(totalMins / 60);
                const m = totalMins % 60;
                if (h > 0 && m > 0) return `${h} hr ${m} min`;
                if (h > 0) return `${h} hr`;
                return `${m} min`;
            };

            const formatAMPM = (timeStr) => {
                if (!timeStr) return '';
                let [hours, minutes] = timeStr.split(':').map(Number);
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const mins = minutes < 10 ? '0' + minutes : minutes;
                return `${hours}:${mins} ${ampm}`;
            };

            // Calculate active totals for Step 1
            const schoolStartMins = timeToMinutes(data.schoolStart);
            const schoolEndMins = timeToMinutes(data.schoolEnd);
            const totalSchoolMins = schoolEndMins > schoolStartMins ? schoolEndMins - schoolStartMins : 0;

            let totalBreakMins = 0;
            data.breaks.forEach(b => {
                if (b.start && b.end) {
                    const start = timeToMinutes(b.start);
                    const end = timeToMinutes(b.end);
                    if (end > start) totalBreakMins += (end - start);
                }
            });

            const dailyTeachingMins = Math.max(0, totalSchoolMins - totalBreakMins);

            const renderStep1 = () => (
                <div className="space-y-6 animate-step" key="step1">

                    {/* School */}
                    <div>
                        <div className="mb-4">
                            <h4 className="text-base font-semibold flex items-center gap-2"><LayersIcon className="w-5 h-5 text-brand-dark" /> School</h4>
                            <p className="text-sm text-slate-500 mt-1">Used in the timetable's file name.</p>
                        </div>
                        <div className="space-y-2">
                            <Label htmlFor="school-name">School Name</Label>
                            <Input id="school-name" placeholder="e.g. St Mary's Primary" value={data.schoolName} onChange={(e) => updateField('schoolName', e.target.value)} error={errors.schoolName} />
                        </div>
                    </div>

                    {/* Bell Times */}
                    <div className="border-t border-slate-200 pt-6">
                        <div className="mb-4">
                            <h4 className="text-base font-semibold flex items-center gap-2"><BellIcon className="w-5 h-5 text-brand-dark" /> Bell Times</h4>
                            <p className="text-sm text-slate-500 mt-1">Set standard operating hours for the day.</p>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div className="space-y-2">
                                <Label htmlFor="school-start">School Start Time</Label>
                                <Input id="school-start" type="time" step="300" value={data.schoolStart} onChange={(e) => updateField('schoolStart', e.target.value)} error={errors.schoolStart} />
                            </div>
                            <div className="space-y-2">
                                <Label htmlFor="school-end">School End Time</Label>
                                <Input id="school-end" type="time" step="300" value={data.schoolEnd} onChange={(e) => updateField('schoolEnd', e.target.value)} error={errors.schoolEnd} />
                            </div>
                        </div>
                    </div>

                    {/* Global Breaks */}
                    <div className="border-t border-slate-200 pt-6">
                        <div className="flex items-start justify-between mb-4">
                            <div>
                                <h4 className="text-base font-semibold flex items-center gap-2"><CoffeeIcon className="w-5 h-5 text-brand-dark" /> Global Breaks</h4>
                                <p className="text-sm text-slate-500 mt-1">Define recess, lunch, or transitions.</p>
                            </div>
                            <Button variant="brand" size="sm" onClick={() => addToList('breaks', { name: "", start: "", end: "" })} className="h-8 gap-1">
                                <PlusIcon className="w-4 h-4 mr-1" /> Add Break
                            </Button>
                        </div>

                        <div id="list-container-breaks" className="space-y-3 max-h-[300px] overflow-y-auto custom-scrollbar p-1 -m-1">

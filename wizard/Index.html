                                    <p className="text-sm text-slate-500 mt-1">Add any Extra Curricular events which will be included as teaching time</p>
                                </div>
                                <Button variant="brand" size="sm" onClick={() => addToList('activities', { name: "" })} className="h-8 gap-1">
                                    <PlusIcon className="w-4 h-4 mr-1" /> Add Activity
                                </Button>
                            </div>

                            <div id="list-container-activities" className="space-y-1.5 max-h-[calc(100vh-24rem)] overflow-y-auto custom-scrollbar p-1 -m-1">
                                {data.activities.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center p-6 border-2 border-dashed border-slate-200 rounded-lg bg-slate-50/50 text-slate-500 animate-pop">
                                        <p className="text-sm font-medium text-slate-700 mb-2">No extra-curriculars added</p>
                                        <Button variant="outline" size="sm" onClick={() => addToList('activities', { name: "" })}>Add Activity</Button>
                                    </div>
                                ) : (
                                    data.activities.map((a, i) => (
                                        <div key={a.id} className="flex items-center gap-2 animate-pop">
                                            <div className="flex-1">
                                                <Input id={`input-${a.id}`} placeholder="Activity Name (e.g. Debate Club)" value={a.name} onChange={(e) => updateList('activities', i, 'name', e.target.value)} error={errors.activities?.[i]?.name} disabled={a.locked} title={a.locked ? "Required for Years 3-6" : undefined} />
                                            </div>
                                            <Button variant="bin" className="px-2 shadow-sm" onClick={() => removeFromList('activities', a.id)} disabled={a.locked}>
                                                <TrashIcon />
                                            </Button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderStep4 = () => {
                const weeklyTeachingMins = dailyTeachingMins * 5;

                // Group staffing by grade
                const expectedGroups = data.grades.filter(g => g.classes > 0).map(g => {
                    const classList = data.staffing.filter(s => s.gradeId === g.id).map(s => ({
                        name: s.className,
                        teacher: s.teacher || 'Unassigned',
                        color: s.color || CLASS_COLOR_PALETTE[0]
                    }));
                    return { grade: g.name, cycle: `${g.cycle} Week${g.cycle > 1 ? 's' : ''}`, classes: classList };
                });

                const toggleSummary = (key) => {
                    setExpandedSummary(prev => ({...prev, [key]: !prev[key]}));
                };

                return (
                    <div className="space-y-6 animate-step" key="step4">
                        <div className="mb-4">
                            <h4 className="text-xl font-semibold text-slate-800">Summary Review</h4>
                            <p className="text-base text-slate-500">Please review your configurations before generating the timetable template{data.schoolName.trim() ? <> for <strong className="text-slate-700">{data.schoolName.trim()}</strong></> : ''}.</p>
                        </div>

                        <div className="max-h-[calc(100vh-24rem)] overflow-y-auto custom-scrollbar p-1 -m-1 space-y-6">

                            {/* Core Schedule & Calculations */}
                            <div className="space-y-3">
                                <h5 className="text-sm font-bold text-slate-900 uppercase tracking-wider border-b border-slate-200 pb-1 flex items-center gap-2"><BellIcon className="w-4 h-4 text-slate-500" /> Core Schedule</h5>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">

                                    {/* Box 1: School Day */}
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 flex flex-col shadow-sm relative">
                                        <span className="text-[10px] sm:text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 block">School Day</span>
                                        <span className="text-2xl sm:text-3xl font-black text-slate-800 mb-6">{formatMinutes(totalSchoolMins)}</span>

                                        <div className="space-y-2 mt-auto">
                                            <div className="flex justify-between items-center text-sm border-t border-slate-200/60 pt-2">
                                                <span className="text-slate-500 font-medium">Start</span>
                                                <span className="font-bold text-slate-700">{formatAMPM(data.schoolStart) || 'Not set'}</span>
                                            </div>
                                            <div className="flex justify-between items-center text-sm">
                                                <span className="text-slate-500 font-medium">End</span>
                                                <span className="font-bold text-slate-700">{formatAMPM(data.schoolEnd) || 'Not set'}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Box 2: Break Time */}
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 flex flex-col shadow-sm">
                                        <span className="text-[10px] sm:text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 block">Break Time</span>
                                        <span className="text-2xl sm:text-3xl font-black text-slate-800 mb-6">{formatMinutes(totalBreakMins)}</span>

                                        <div className="space-y-3 mt-auto">
                                            {data.breaks.length === 0 && <span className="text-sm text-slate-500 italic block border-t border-slate-200/60 pt-2">No breaks configured.</span>}
                                            {data.breaks.map((b, idx) => {
                                                const dur = timeToMinutes(b.end) - timeToMinutes(b.start);
                                                return (
                                                <div key={b.id} className={`flex flex-col gap-0.5 text-sm ${idx === 0 ? 'border-t border-slate-200/60 pt-2' : ''}`}>
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-slate-700 font-semibold truncate pr-2" title={b.name}>{b.name || 'Unnamed'}</span>
                                                        <span className="font-bold text-slate-700 shrink-0 text-right">{dur > 0 ? formatMinutes(dur) : '0 min'}</span>
                                                    </div>
                                                    <span className="text-xs text-slate-500 font-medium">
                                                        {formatAMPM(b.start) || 'Not set'} - {formatAMPM(b.end) || 'Not set'}
                                                    </span>
                                                </div>
                                            )})}
                                        </div>
                                    </div>

                                    {/* Box 3: Teaching Time */}
                                    <div className="border rounded-lg p-4 flex flex-col shadow-sm relative bg-brand-green/10 border-brand-green/20">
                                        <div className="flex justify-between items-start mb-1">
                                            <span className="text-[10px] sm:text-[11px] font-bold uppercase tracking-wider block text-brand-dark">Teaching Time</span>
                                        </div>
                                        <span className="text-2xl sm:text-3xl font-black mb-6 text-brand-dark">{formatMinutes(dailyTeachingMins)}</span>

                                        <div className="space-y-2 mt-auto">
                                            <div className="flex justify-between items-center text-sm border-t pt-2 border-brand-green/20">
                                                <span className="font-medium text-slate-600">Weekly Total</span>
                                                <span className="font-bold text-brand-dark">{formatMinutes(weeklyTeachingMins)}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Grouped Staffing by Grade */}
                            <div className="space-y-3 pt-2">
                                <button
                                    onClick={() => toggleSummary('staff')}
                                    className="w-full flex justify-between items-center text-sm font-bold text-slate-900 uppercase tracking-wider border-b border-slate-200 pb-1 hover:text-brand-dark transition-colors"
                                >
                                    <span className="flex items-center gap-2"><LayersIcon className="w-4 h-4 text-slate-500" /> Classes & Staffing ({data.staffing.length} total)</span>
                                    {expandedSummary.staff ? <ChevronUpIcon className="w-5 h-5 text-slate-400" /> : <ChevronDownIcon className="w-5 h-5 text-slate-400" />}
                                </button>

                                {expandedSummary.staff && (
                                    <div className="space-y-4 animate-pop">
                                        {expectedGroups.map((group, idx) => (
                                            <div key={idx} className="bg-slate-50 rounded-lg border border-slate-200 shadow-sm overflow-hidden">
                                                <div className="bg-slate-200/50 px-4 py-2 border-b border-slate-200 flex justify-between items-center">
                                                    <span className="font-bold text-slate-800 text-sm">{group.grade}</span>
                                                    <span className="text-[10px] uppercase font-bold text-slate-600 bg-slate-200 px-2 py-1 rounded tracking-wider">{group.cycle}</span>
                                                </div>
                                                <div className="p-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                                    {group.classes.map((cls, cIdx) => (
                                                        <div key={cIdx} className="bg-white border border-slate-200 p-2.5 rounded-md flex items-start gap-2 shadow-sm">
                                                            <span className="w-3 h-3 rounded-full border border-slate-200 mt-1 shrink-0" style={{ backgroundColor: cls.color }} title={cls.color}></span>
                                                            <div className="flex flex-col">
                                                                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">{cls.name || 'Unnamed Class'}</span>
                                                                <span className={`text-sm font-medium ${cls.teacher === 'Unassigned' ? 'text-red-500 italic' : 'text-brand-dark'}`}>{cls.teacher}</span>
                                                            </div>
                                                        </div>
                                                    ))}
                                                    {group.classes.length === 0 && <span className="text-xs italic text-slate-500">No classes configured.</span>}
                                                </div>
                                            </div>
                                        ))}
                                        {expectedGroups.length === 0 && <p className="text-sm text-slate-500 italic">No grades configured.</p>}
                                    </div>
                                )}
                            </div>

                            {/* Specialists */}
                            <div className="space-y-3 pt-2">
                                <button
                                    onClick={() => toggleSummary('specialists')}
                                    className="w-full flex justify-between items-center text-sm font-bold text-slate-900 uppercase tracking-wider border-b border-slate-200 pb-1 hover:text-brand-dark transition-colors"
                                >
                                    <span className="flex items-center gap-2"><StarIcon className="w-4 h-4 text-slate-500" /> Specialist Profiles ({data.specialists.length})</span>
                                    {expandedSummary.specialists ? <ChevronUpIcon className="w-5 h-5 text-slate-400" /> : <ChevronDownIcon className="w-5 h-5 text-slate-400" />}
                                </button>

                                {expandedSummary.specialists && (
                                    <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-800 animate-pop">
                                        {data.specialists.filter(s => s.name).map(s => (
                                            <li key={s.id} className="bg-slate-50 p-2.5 rounded-md border border-slate-100 flex flex-col gap-1 shadow-sm">
                                                <span className="font-semibold text-slate-900">{s.name}</span>
                                                <div className="flex items-center gap-2 flex-wrap">
                                                    <span className="text-xs text-brand-dark font-medium bg-brand-green/10 px-2 py-0.5 rounded-md">{s.kla || 'No KLA Assigned'}</span>
                                                    <span className="text-xs text-slate-600 font-medium bg-slate-200/70 px-2 py-0.5 rounded-md">{s.cycle || 1} Week{(s.cycle || 1) > 1 ? 's' : ''}</span>
                                                </div>
                                            </li>
                                        ))}
                                        {data.specialists.filter(s => s.name).length === 0 && <li className="text-slate-500 italic text-xs list-none col-span-2">None configured.</li>}
                                    </ul>
                                )}
                            </div>

                            {/* Activities */}
                            <div className="space-y-3 pt-2">
                                <button
                                    onClick={() => toggleSummary('activities')}
                                    className="w-full flex justify-between items-center text-sm font-bold text-slate-900 uppercase tracking-wider border-b border-slate-200 pb-1 hover:text-brand-dark transition-colors"
                                >
                                    <span className="flex items-center gap-2"><ActivityIcon className="w-4 h-4 text-slate-500" /> Extra-Curriculars ({data.activities.length})</span>
                                    {expandedSummary.activities ? <ChevronUpIcon className="w-5 h-5 text-slate-400" /> : <ChevronDownIcon className="w-5 h-5 text-slate-400" />}
                                </button>

                                {expandedSummary.activities && (
                                    <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-800 animate-pop">
                                        {data.activities.filter(a => a.name).map(a => (
                                            <li key={a.id} className="bg-slate-50 p-2.5 rounded-md border border-slate-100 flex items-center gap-2 shadow-sm">
                                                <span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span>{a.name}
                                            </li>
                                        ))}
                                        {data.activities.filter(a => a.name).length === 0 && <li className="text-slate-500 italic text-xs list-none col-span-2">None configured.</li>}
                                    </ul>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="w-full flex flex-col items-center">

                    {/* BRANDING HEADER */}
                    <div className="w-full flex flex-col sm:flex-row items-center sm:items-start gap-5 mb-8 sm:mb-10">
                        <div className="w-[84px] h-[84px] rounded-[1.25rem] bg-brand-bg flex items-center justify-center shrink-0 shadow-sm">
                            <GridIcon />
                        </div>
                        <div className="flex flex-col justify-center text-center sm:text-left pt-1">
                            <h1 className="text-[34px] leading-none font-extrabold tracking-tighter text-slate-900 mb-3">
                                the<span className="text-brand-green">timetable</span>tool<span className="text-brand-green">.</span>
                            </h1>
                            <p className="text-slate-500 text-[13.5px] font-medium leading-snug max-w-md">
                                Automated spreadsheet designed to help primary schools create NESA-compliant timetables.
                            </p>
                        </div>
                    </div>

                    {/* GENERATION PROGRESS SCREEN */}
                    {isGenerating ? (
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 overflow-hidden animate-pop flex flex-col">
                            <CardHeader className="border-b border-slate-200 bg-white p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 z-10 relative shadow-[0_4px_10px_-5px_rgba(0,0,0,0.05)]">
                                <div className="flex items-center gap-3">
                                    <div className="relative">
                                        <div className="w-10 h-10 rounded-full border-2 border-slate-200 border-t-brand-green animate-spin"></div>
                                        <div className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-slate-800">
                                            {loadingProgress}%
                                        </div>
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-900 leading-tight">Generating Timetable</h3>
                                        <p className="text-xs text-slate-500">Google Apps Script Execution Engine</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4 text-xs bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600">
                                    <div className="flex items-center gap-1.5">
                                        <ClockIcon />
                                        <span>Elapsed: <strong className="text-slate-900 font-mono">{formatElapsed(elapsedSeconds)}</strong></span>
                                    </div>
                                </div>
                            </CardHeader>

                            <CardContent className="p-6 sm:p-8 bg-slate-50 flex flex-col gap-6">
                                {/* Progress Bar */}
                                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
                                    <div className="flex justify-between items-center text-xs font-bold text-slate-700">
                                        <span className="uppercase tracking-wider text-slate-500">Total Completion</span>
                                        <span className="text-brand-dark font-mono text-sm">{loadingProgress}%</span>
                                    </div>
                                    <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden p-0.5 border border-slate-200">
                                        <div
                                            className="bg-brand-dark h-full rounded-full transition-all duration-500 ease-out"
                                            style={{ width: `${loadingProgress}%` }}
                                        ></div>
                                    </div>
                                    <div className="flex items-center gap-2 pt-1 text-xs font-semibold text-slate-800 animate-pulse">
                                        <span className="w-2 h-2 rounded-full bg-brand-green"></span>
                                        <span>Current Action: <span className="font-normal text-slate-600">{loadingMessage || 'Processing...'}</span></span>
                                    </div>
                                </div>

                                {/* Live Activity Log Stream */}
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                                    <div className="bg-slate-100/70 px-4 py-2.5 border-b border-slate-200 flex items-center justify-between">
                                        <span className="text-xs font-bold uppercase tracking-wider text-slate-600 flex items-center gap-1.5">
                                            <ActivityIcon className="w-3.5 h-3.5 text-brand-dark" />
                                            Live Execution Log ({logs.length} events)
                                        </span>
                                        <span className="text-[10px] font-mono text-slate-500 bg-slate-200/80 px-2 py-0.5 rounded">
                                            Job ID: {activeJobId || 'Simulated'}
                                        </span>
                                    </div>

                                    <div
                                        ref={logContainerRef}
                                        className="p-4 max-h-[220px] overflow-y-auto custom-scrollbar font-mono text-xs space-y-2 bg-white text-slate-800"
                                    >
                                        {logs.map((log) => (
                                            <div key={log.id} className="flex items-start gap-2.5 leading-relaxed animate-pop">
                                                <span className="text-slate-400 text-[10px] shrink-0 pt-0.5 font-sans">{log.time}</span>
                                                <span className="text-brand-dark font-bold shrink-0">[{log.percent}%]</span>
                                                <span className="text-slate-700 break-words flex-1 font-sans">{log.text}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Callout Notice */}
                                <div className="bg-amber-50/80 border border-amber-200/80 p-3.5 rounded-lg flex items-start gap-3 text-xs text-amber-900">
                                    <AlertTriangleIcon className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
                                    <p className="leading-relaxed">
                                        Creating multi-week timetable structures and copying templates takes up to 1-2 minutes depending on class count. <strong>Please keep this window open</strong> while Google Apps Script sets up your spreadsheet.
                                    </p>
                                </div>
                            </CardContent>
                        </Card>
                    ) : isSuccess ? (
                        /* SUCCESS SCREEN */
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 overflow-hidden animate-pop flex flex-col">
                            <CardContent className="p-12 flex flex-col items-center justify-center text-center min-h-[500px]">
                                <div className="animate-success mb-8">
                                    <div className="mx-auto bg-brand-green/10 w-24 h-24 rounded-full flex items-center justify-center text-brand-dark shadow-sm">
                                        <CheckIcon className="w-12 h-12" />
                                    </div>
                                </div>
                                <h3 className="text-3xl font-bold text-slate-800 mb-3">Timetable Generated</h3>
                                <p className="text-base text-slate-500 mb-10 max-w-md">Your timetable has been created and saved in the <strong>Timetables</strong> folder in your My Drive.</p>

                                <div className="flex flex-col sm:flex-row gap-4 w-full justify-center">
                                    <a href={generatedUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center whitespace-nowrap rounded-md text-base font-bold transition-all duration-200 active:scale-95 h-12 px-8 bg-brand-dark text-white hover:bg-[#00663C] shadow-lg">
                                        Open Spreadsheet
                                    </a>
                                </div>
                            </CardContent>
                        </Card>
                    ) : (
                        /* WIZARD SCREEN */
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 overflow-hidden flex flex-col">
                            <CardHeader className="border-b border-slate-200 bg-slate-50 px-6 py-8 sm:px-10 z-10 relative shadow-[0_4px_10px_-5px_rgba(0,0,0,0.05)]">
                                {/* Stepper Header */}
                                <div className="flex items-center justify-between relative">
                                    <div className="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-[2px] bg-slate-300 -z-10"></div>

                                    {[1, 2, 3, 4].map((s) => (
                                        <div key={s} aria-current={step === s ? "step" : undefined} className="flex flex-col items-center gap-2 bg-slate-50 px-2 sm:px-4">
                                            <div className={`w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold border-2 transition-colors ${
                                                step === s ? 'border-slate-900 bg-slate-900 text-white shadow-md' :
                                                step > s ? 'border-brand-green bg-brand-green text-white' : 'border-slate-300 bg-white text-slate-400'
                                            }`}>
                                                {step > s ? <CheckIcon /> : s}
                                            </div>
                                            <span className={`text-[10px] sm:text-[11px] font-semibold uppercase tracking-wider ${step >= s ? 'text-slate-900' : 'text-slate-400'} hidden md:block`}>
                                                {s === 1 ? 'Core Schedule' : s === 2 ? 'Grades' : s === 3 ? 'Staff' : 'Summary'}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </CardHeader>

                            <CardContent className="p-6 sm:p-10 min-h-[400px] bg-white relative flex-1">
                                {step === 1 && renderStep1()}
                                {step === 2 && renderStep2()}
                                {step === 3 && renderStep3()}
                                {step === 4 && generationError && (
                                    <div role="alert" className="mb-6 bg-red-50 border border-red-200 p-4 rounded-lg flex items-start gap-3 text-sm text-red-900 animate-pop">
                                        <AlertTriangleIcon className="w-5 h-5 text-red-600 shrink-0 mt-0.5" />
                                        <div className="flex-1">
                                            <p className="font-semibold mb-1">The timetable wasn't generated</p>
                                            <p className="whitespace-pre-line leading-relaxed">{generationError}</p>
                                        </div>
                                        <Button variant="outline" onClick={handleSubmit} className="shrink-0">Try again</Button>
                                    </div>
                                )}
                                {step === 4 && renderStep4()}
                            </CardContent>

                            <CardFooter className="flex items-start justify-between bg-slate-50 border-t border-slate-200 p-6 sm:px-10 h-28 pt-8 shrink-0">
                                <Button variant="outline" onClick={handleBack} disabled={step === 1}>
                                    Back
                                </Button>

                                {step < 4 ? (
                                    <Button variant="default" onClick={handleNext}>Continue to Step {step + 1}</Button>
                                ) : (
                                    <Button variant="footerSolid" onClick={handleSubmit} disabled={isGenerating} className="gap-2 px-6">
                                        Generate Timetable Template
                                    </Button>
                                )}
                            </CardFooter>
                        </Card>
                    )}

                    {/* SUITE TAG */}
                    <div className="mt-12 mb-4 text-[11px] font-medium text-brand-green tracking-widest text-center uppercase">
                        A Sydney Catholic Schools Curriculum Tool - 2026
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

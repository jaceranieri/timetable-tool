<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Configuration Wizard</title>
    <!-- Pinned versions, so a new release of a library can't change or break the wizard. -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Figtree', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif']
                    },
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        brand: {
                            green: "#00b268", /* Original Brand Green for accents/logos */
                            dark: "#007A48",  /* WCAG AA Compliant Green for Buttons with white text */
                            bg: "#f4f7f9"
                        },
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        destructive: {
                            DEFAULT: "hsl(var(--destructive))",
                            foreground: "hsl(var(--destructive-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
        }
        body { background-color: #f8fafc; color: hsl(var(--foreground)); font-family: Figtree, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

        /* Custom scrollbar for lists */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }

        /* Microanimations */
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-step { animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.97) translateY(5px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes successPop {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-success { animation: successPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes softPulse {
            0%, 100% { box-shadow: 0 10px 25px -10px rgba(0, 122, 72, 0.55), 0 0 0 0 rgba(0, 178, 104, 0.45); transform: scale(1); }
            50% { box-shadow: 0 14px 30px -10px rgba(0, 122, 72, 0.6), 0 0 0 14px rgba(0, 178, 104, 0); transform: scale(1.02); }
        }
        .animate-soft-pulse { animation: softPulse 2.8s ease-in-out infinite; }

        @media (prefers-reduced-motion: reduce) {
            .animate-step, .animate-pop, .animate-success, .animate-spin, .animate-pulse, .animate-soft-pulse { animation: none; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-12 pb-8 px-4 sm:px-8">
    <div id="root" class="w-full max-w-4xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- BASE UI COMPONENTS ---
        const Card = ({ children, className = "" }) => (
            <div className={`rounded-xl border border-slate-200 bg-white text-slate-950 shadow-sm ${className}`}>{children}</div>
        );
        const CardHeader = ({ children, className = "" }) => <div className={`flex flex-col space-y-1.5 p-6 ${className}`}>{children}</div>;
        const CardContent = ({ children, className = "" }) => <div className={`p-6 pt-0 ${className}`}>{children}</div>;
        const CardFooter = ({ children, className = "" }) => <div className={`flex items-center p-6 pt-0 ${className}`}>{children}</div>;

        const Label = ({ children, className = "", htmlFor }) => (
            <label htmlFor={htmlFor} className={`text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 ${className}`}>{children}</label>
        );

        // A field's error is shown inside it and read out with it (aria-describedby).
        const errorIdFor = (id, error) => (error && id ? `${id}-error` : undefined);

        // boxLabel puts a small label inside the top of a slightly taller box.
        const Input = ({ className = "", error, id, boxLabel, ...props }) => (
            <div className="relative w-full flex items-center">
                <input id={id} aria-invalid={error ? true : undefined} aria-describedby={errorIdFor(id, error)} className={`flex ${boxLabel ? 'h-12 pt-5 pb-1' : 'h-10 py-2'} w-full rounded-md border ${error ? 'border-red-500 pr-[80px] ring-1 ring-red-500/20' : 'border-slate-200'} bg-white px-3 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 transition-shadow ${className}`} {...props} />
                {boxLabel && (
                    <label htmlFor={id} className="absolute left-3 top-1.5 text-[10px] font-semibold uppercase tracking-wider text-slate-500 pointer-events-none">{boxLabel}</label>
                )}
                {error && (
                    <div className="absolute right-2 flex items-center gap-1 text-[11px] font-medium text-red-600 bg-white px-1 pointer-events-none animate-pop">
                        <AlertCircleIcon className="w-3.5 h-3.5" aria-hidden="true" />
                        <span id={errorIdFor(id, error)}>{error}</span>
                    </div>
                )}
            </div>
        );

        const Select = ({ className = "", error, id, boxLabel, children, ...props }) => (
            <div className="relative w-full flex items-center">
                {boxLabel && (
                    <label htmlFor={id} className="absolute left-3 top-1.5 z-10 text-[10px] font-semibold uppercase tracking-wider text-slate-500 pointer-events-none">{boxLabel}</label>
                )}
                <select id={id} aria-invalid={error ? true : undefined} aria-describedby={errorIdFor(id, error)} className={`flex ${boxLabel ? 'h-12 pt-5 pb-1' : 'h-10 py-2'} w-full appearance-none rounded-md border ${error ? 'border-red-500 pr-[96px] ring-1 ring-red-500/20' : 'border-slate-200 pr-9'} bg-white pl-3 text-sm ring-offset-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 transition-shadow ${className}`} {...props}>
                    {children}
                </select>
                {!error && (
                    <ChevronDownIcon className="w-4 h-4 text-slate-500 absolute right-3 pointer-events-none" />
                )}
                {error && (
                    <div className="absolute right-7 flex items-center gap-1 text-[11px] font-medium text-red-600 bg-white px-1 pointer-events-none animate-pop">
                        <AlertCircleIcon className="w-3.5 h-3.5" aria-hidden="true" />
                        <span id={errorIdFor(id, error)}>{error}</span>
                    </div>
                )}
            </div>
        );

        const Button = ({ children, variant = "default", className = "", ...props }) => {
            const variants = {
                default: "bg-slate-900 text-slate-50 hover:bg-slate-900/90",
                destructive: "bg-red-600 text-slate-50 hover:bg-red-700",
                bin: "bg-slate-700 text-slate-100 hover:bg-red-600 hover:text-white shadow-sm",
                outline: "border border-slate-200 bg-white hover:bg-slate-100 hover:text-slate-900",
                brand: "bg-brand-dark text-white hover:bg-[#00663C] shadow-sm",
                ghost: "hover:bg-slate-100 hover:text-slate-900",
                footerOutline: "border border-slate-300 text-slate-700 hover:bg-slate-100 shadow-sm",
                footerSolid: "bg-brand-dark text-white hover:bg-[#00663C] shadow-md font-semibold",
            };
            return (
                <button type="button" className={`inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-white transition-all duration-200 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-10 px-4 py-2 ${variants[variant] || variants.default} ${className}`} {...props}>
                    {children}
                </button>
            );
        };

        const DotsIcon = () => <svg className="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>;

        // A "..." button with a short menu. Arrow keys move through the items;
        // Escape or a click elsewhere closes it.
        const MoreMenu = ({ label, items, className = "", icon, boxed }) => {
            const [open, setOpen] = useState(false);
            const buttonRef = useRef(null);
            const menuRef = useRef(null);
            useEffect(() => {
                if (!open) return;
                const first = menuRef.current && menuRef.current.querySelector('[role="menuitem"]');
                if (first) first.focus();
                const closeOnOutsideClick = (e) => {
                    if (menuRef.current && !menuRef.current.contains(e.target) && !buttonRef.current.contains(e.target)) setOpen(false);
                };
                document.addEventListener('mousedown', closeOnOutsideClick);
                return () => document.removeEventListener('mousedown', closeOnOutsideClick);
            }, [open]);
            const onKeyDown = (e) => {
                const entries = [...menuRef.current.querySelectorAll('[role="menuitem"]')];
                const index = entries.indexOf(document.activeElement);
                if (e.key === 'Escape') { e.preventDefault(); setOpen(false); buttonRef.current.focus(); }
                else if (e.key === 'ArrowDown') { e.preventDefault(); entries[(index + 1) % entries.length].focus(); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); entries[(index - 1 + entries.length) % entries.length].focus(); }
                else if (e.key === 'Tab') setOpen(false);
            };
            return (
                <div className={`relative inline-flex ${className}`}>
                    <button ref={buttonRef} type="button" aria-label={label} title={label} aria-haspopup="menu" aria-expanded={open}
                        onClick={() => setOpen(prev => !prev)}
                        className={`inline-flex items-center justify-center rounded-md transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 ${boxed
                            ? `w-10 h-10 border shadow-sm ${open ? 'border-slate-400 bg-slate-100 text-slate-900' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-100 hover:text-slate-900'}`
                            : 'w-9 h-10 text-slate-600 hover:bg-slate-200/70 hover:text-slate-900'}`}>
                        {icon || <DotsIcon />}
                    </button>
                    {open && (
                        <div ref={menuRef} role="menu" aria-label={label} onKeyDown={onKeyDown}
                            className="absolute right-0 top-full mt-1 z-50 w-64 bg-white border border-slate-200 rounded-lg shadow-xl py-1 animate-pop">
                            {items.map(item => (
                                <button key={item.label} type="button" role="menuitem" tabIndex={-1}
                                    onClick={() => { setOpen(false); item.onSelect(); }}
                                    className="w-full text-left px-3 py-2 text-sm text-slate-800 hover:bg-slate-100 focus:bg-slate-100 focus:outline-none">
                                    <span className="font-medium">{item.label}</span>
                                    {item.hint && <span className="block text-xs text-slate-600">{item.hint}</span>}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // A light bin button, the same height as the boxes with labels inside.
        const RemoveButton = ({ label, className = "", ...props }) => (
            <button type="button" aria-label={label} title={props.title || label} {...props}
                className={`w-9 h-12 shrink-0 inline-flex items-center justify-center rounded-md text-slate-400 hover:bg-red-50 hover:text-red-600 disabled:opacity-30 disabled:pointer-events-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 ${className}`}>
                <TrashIcon />
            </button>
        );

        const InfoIcon = () => <svg className="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;

        // A section's heading, with its description behind an "i" button
        // (opens on click; Escape or a click elsewhere closes it), and any
        // buttons for the section on the right.
        const SectionHeader = ({ id, title, info, children }) => {
            const [open, setOpen] = useState(false);
            const ref = useRef(null);
            useEffect(() => {
                if (!open) return;
                const closeOnOutsideClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                const closeOnEscape = (e) => { if (e.key === 'Escape') setOpen(false); };
                document.addEventListener('mousedown', closeOnOutsideClick);
                document.addEventListener('keydown', closeOnEscape);
                return () => {
                    document.removeEventListener('mousedown', closeOnOutsideClick);
                    document.removeEventListener('keydown', closeOnEscape);
                };
            }, [open]);
            return (
                <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div ref={ref} className="relative flex items-center gap-1.5">
                        <h3 className="text-xl font-bold tracking-tight text-slate-900">{title}</h3>
                        {info && (
                            <button type="button" aria-label={`About ${title}`} aria-expanded={open} aria-controls={`${id}-info`}
                                onClick={() => setOpen(prev => !prev)}
                                className={`w-7 h-7 inline-flex items-center justify-center rounded-full transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 ${open ? 'bg-brand-green/10 text-brand-dark' : 'text-slate-500 hover:bg-slate-100 hover:text-brand-dark'}`}>
                                <InfoIcon />
                            </button>
                        )}
                        {info && open && (
                            <div id={`${id}-info`} className="absolute left-0 top-full mt-2 z-30 w-80 max-w-[85vw] rounded-lg bg-slate-900 text-white text-sm leading-relaxed shadow-xl px-3.5 py-2.5 animate-pop">
                                {info}
                            </div>
                        )}
                    </div>
                    {children && <div className="flex items-center gap-2">{children}</div>}
                </div>
            );
        };

        // An "i" that shows a short explanation while hovered or focused.
        const HoverInfo = ({ id, text, label, className = "" }) => {
            const [open, setOpen] = useState(false);
            return (
                <span className={`relative inline-flex ${className}`}
                    onMouseEnter={() => setOpen(true)} onMouseLeave={() => setOpen(false)}>
                    <button type="button" aria-label={label} aria-describedby={open ? id : undefined}
                        onFocus={() => setOpen(true)} onBlur={() => setOpen(false)}
                        onKeyDown={(e) => { if (e.key === 'Escape') setOpen(false); }}
                        onClick={() => setOpen(prev => !prev)}
                        className="w-7 h-7 inline-flex items-center justify-center rounded-full text-white/80 hover:text-white hover:bg-white/15 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
                        <InfoIcon />
                    </button>
                    {open && (
                        <span id={id} role="tooltip"
                            className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 z-30 w-64 rounded-lg bg-slate-900 text-white text-xs leading-relaxed shadow-xl px-3 py-2 text-left animate-pop">
                            {text}
                        </span>
                    )}
                </span>
            );
        };

        // Asks for a timetable's link, then reads its setup (readTimetableSetup in Code.gs).
        const LinkDialog = ({ mode, onLoaded, onClose }) => {
            const [link, setLink] = useState("");
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState("");
            const editing = mode === 'edit';
            useEffect(() => {
                const closeOnEscape = (e) => { if (e.key === 'Escape' && !busy) onClose(); };
                document.addEventListener('keydown', closeOnEscape);
                return () => document.removeEventListener('keydown', closeOnEscape);
            }, [busy]);
            const open = () => {
                if (!link.trim()) { setError("Paste the timetable's link first."); return; }
                if (typeof google === 'undefined' || !google.script) { setError("This only works in the deployed wizard."); return; }
                setBusy(true);
                setError("");
                google.script.run
                    .withSuccessHandler(setup => { setBusy(false); onLoaded(setup); })
                    .withFailureHandler(err => {
                        setBusy(false);
                        setError(String((err && err.message) || err || "The timetable couldn't be opened.").replace(/^((Error|Exception):\s*)+/i, ""));
                    })
                    .readTimetableSetup(link.trim());
            };
            return ReactDOM.createPortal(
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4" onMouseDown={(e) => { if (e.target === e.currentTarget && !busy) onClose(); }}>
                    <div role="dialog" aria-modal="true" aria-labelledby="link-dialog-title" className="w-full max-w-lg rounded-2xl bg-white shadow-2xl p-6 animate-pop">
                        <h2 id="link-dialog-title" className="text-xl font-bold text-slate-900">{editing ? 'Edit an existing timetable' : 'Start from an existing timetable'}</h2>
                        <p className="text-sm text-slate-600 mt-1 mb-4">
                            {editing
                                ? "Paste the timetable's link. Its setup opens in the wizard; change what you need, and the timetable is updated in place, keeping every lesson already entered."
                                : "Paste a timetable's link, for example last year's. Its setup opens in the wizard, and a new timetable is made from it; the old one isn't changed."}
                        </p>
                        <Input id="timetable-link" boxLabel="Timetable link" placeholder="https://docs.google.com/spreadsheets/d/..." value={link}
                            onChange={(e) => { setLink(e.target.value); setError(""); }} onKeyDown={(e) => { if (e.key === 'Enter') open(); }}
                            autoFocus disabled={busy} />
                        {error && <p role="alert" className="mt-2 text-sm text-red-700">{error}</p>}
                        <div className="flex justify-end gap-2 mt-5">
                            <Button variant="outline" onClick={onClose} disabled={busy}>Cancel</Button>
                            <Button variant="brand" onClick={open} disabled={busy}>{busy ? 'Opening...' : 'Open timetable'}</Button>
                        </div>
                    </div>
                </div>,
                document.body
            );
        };

        // A cycle length shown as its number inside a circular arrow, on a
        // square button. Click to choose 1-10 weeks; arrow keys step it.
        const CycleButton = ({ id, value, onChange, owner, className = "", size = "md", lockedReason }) => {
            const [open, setOpen] = useState(false);
            const ref = useRef(null);
            const weeks = Number(value) || 1;
            useEffect(() => {
                if (!open) return;
                const chosen = ref.current && ref.current.querySelector('[aria-pressed="true"]');
                if (chosen) chosen.focus();
                const closeOnOutsideClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                const closeOnEscape = (e) => { if (e.key === 'Escape') { setOpen(false); const button = document.getElementById(id); if (button) button.focus(); } };
                document.addEventListener('mousedown', closeOnOutsideClick);
                document.addEventListener('keydown', closeOnEscape);
                return () => {
                    document.removeEventListener('mousedown', closeOnOutsideClick);
                    document.removeEventListener('keydown', closeOnEscape);
                };
            }, [open]);
            const step = (by) => onChange(Math.min(MAX_CYCLE_WEEKS, Math.max(1, weeks + by)));
            return (
                <div ref={ref} className={`relative inline-flex ${className}`}>
                    <button id={id} type="button" aria-haspopup={lockedReason ? undefined : 'true'} aria-expanded={lockedReason ? undefined : open}
                        aria-disabled={lockedReason ? true : undefined}
                        aria-label={`${owner} cycle: ${weeks} ${weeks === 1 ? 'week' : 'weeks'}. ${lockedReason ? lockedReason : 'Change'}`}
                        title={lockedReason || `Cycle: ${weeks} ${weeks === 1 ? 'week' : 'weeks'}`}
                        onClick={() => { if (!lockedReason) setOpen(prev => !prev); }}
                        onKeyDown={(e) => {
                            if (lockedReason) return;
                            if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); step(1); }
                            if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
                        }}
                        className={`group ${size === 'lg' ? 'w-12 h-12' : 'w-10 h-10'} inline-flex items-center justify-center rounded-md border shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 ${
                            lockedReason ? 'border-slate-200 bg-slate-50 cursor-not-allowed' : open ? 'border-brand-dark bg-brand-green/10' : 'border-slate-300 bg-white hover:border-brand-dark'}`}>
                        <svg viewBox="0 0 24 24" className={size === 'lg' ? 'w-9 h-9' : 'w-8 h-8'} aria-hidden="true">
                            {/* Light arrow, dark number */}
                            <g className={open ? 'text-brand-green' : 'text-slate-300 group-hover:text-brand-green'} fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M20 12a8 8 0 1 1-8-8c2.24 0 4.38.89 5.99 2.44L20 8.5" />
                                <path d="M20 4v4.5h-4.5" />
                            </g>
                            <text x="12" y="15.4" textAnchor="middle" fontSize={weeks > 9 ? 7.5 : 9.5} fontWeight="800" className="fill-slate-900" fontFamily="Figtree, sans-serif">{weeks}</text>
                        </svg>
                    </button>
                    {open && (
                        <div role="group" aria-label={`${owner} cycle length`}
                            className="absolute right-0 top-full mt-1 z-40 w-56 bg-white border border-slate-200 rounded-lg shadow-xl p-3 animate-pop">
                            <p className="text-xs font-semibold text-slate-700 mb-2">Cycle length (weeks)</p>
                            <div className="grid grid-cols-5 gap-1.5">
                                {Array.from({ length: MAX_CYCLE_WEEKS }, (_, i) => i + 1).map(n => (
                                    <button key={n} type="button" aria-pressed={n === weeks}
                                        aria-label={`${n} ${n === 1 ? 'week' : 'weeks'}`}
                                        onClick={() => { onChange(n); setOpen(false); const button = document.getElementById(id); if (button) button.focus(); }}
                                        className={`h-8 rounded-md text-sm font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 ${
                                            n === weeks ? 'bg-brand-dark text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                                        {n}
                                    </button>
                                ))}
                            </div>
                            <p className="text-[11px] text-slate-600 mt-2 leading-snug">How many weeks the timetable runs before repeating.</p>
                        </div>
                    )}
                </div>
            );
        };

                                            <Button variant="bin" className="px-2 h-10 w-full sm:w-10 shadow-sm" onClick={() => updateList('grades', i, 'classes', 0)} aria-label={`No ${g.name} classes`}>
                                                <TrashIcon />
                                            </Button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const renderStep3 = () => {
                // A class needs attention if it has an error from the last check,
                // or a teacher but no name. Blank rows are skipped; a blank
                // teacher is fine (TBC).
                const classNeedsAttention = (s) => {
                    if (isBlankClass(s)) return false;
                    const globalIdx = data.staffing.findIndex(st => st.id === s.id);
                    const rowErrors = errors.staffing?.[globalIdx] || {};
                    return Object.values(rowErrors).some(Boolean) || !s.className.trim();
                };
                const countNeedingAttention = (gradeId) =>
                    data.staffing.filter(s => s.gradeId === gradeId && classNeedsAttention(s)).length;
                const countClasses = (gradeId) =>
                    data.staffing.filter(s => s.gradeId === gradeId && !isBlankClass(s)).length;
                const cycleMismatches = findCycleMismatches(data);

                // Arrow keys, Home and End move between the grade tabs.
                const tabIds = data.grades.filter(g => g.classes > 0).map(g => g.id);
                const onTabKeyDown = (e) => {
                    const index = tabIds.indexOf(currentTabId);
                    const next = { ArrowRight: tabIds[(index + 1) % tabIds.length], ArrowLeft: tabIds[(index - 1 + tabIds.length) % tabIds.length],
                        Home: tabIds[0], End: tabIds[tabIds.length - 1] }[e.key];
                    if (!next) return;
                    e.preventDefault();
                    setActiveGradeTab(next);
                    setTimeout(() => { const tab = document.getElementById(`grade-tab-${next}`); if (tab) tab.focus(); }, 0);
                };

                const gradesWithClasses = data.grades.filter(g => g.classes > 0);
                const currentTabId = activeGradeTab && gradesWithClasses.some(g => g.id === activeGradeTab)
                    ? activeGradeTab
                    : (gradesWithClasses.length > 0 ? gradesWithClasses[0].id : null);

                return (
                    <div className="space-y-8 animate-step" key="step3">
                        {/* Classroom Teachers */}
                        <div>
                            <div className="mb-4">

                                <p className="text-sm text-slate-500 mt-1">Name each class and add its teacher. The number of rows is set by Step 2. Leave a teacher blank if they aren't known yet (the timetable shows TBC); rows left completely blank are skipped.</p>
                            </div>

                                <div className="flex flex-col items-center justify-center p-8 border-2 border-dashed border-slate-200 rounded-lg bg-slate-50/50 text-slate-500 animate-pop">

                                    <p className="text-sm font-medium text-slate-700 mb-1">No classes configured</p>

                                                    type="button"
                                                    id={`grade-tab-${g.id}`}

                                                    aria-selected={isActive}
                                                    aria-controls={`grade-panel-${g.id}`}
                                                    tabIndex={isActive ? 0 : -1}
                                                    onClick={() => setActiveGradeTab(g.id)}
                                                    className={`flex items-center gap-2 px-4 py-2.5 text-sm font-bold border-b-2 transition-colors whitespace-nowrap rounded-t-md focus-visible:outline-none focus-visible:bg-slate-100 ${
                                                        isActive
                                                            ? 'border-brand-dark text-brand-dark bg-white shadow-[0_-2px_6px_-2px_rgba(0,0,0,0.05)]'
                                                            : 'border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {g.name}
                                                    <span className="text-[11px] font-semibold text-slate-600 bg-slate-200/70 px-1.5 py-0.5 rounded"><span className="sr-only">, </span>{countClasses(g.id)}<span className="sr-only"> classes</span></span>
                                                    {attentionCount === 0 ? (
                                                        <CheckCircleIcon className="w-4 h-4 text-brand-dark" aria-hidden="true" />
                                                    ) : (
                                                        <span className="flex items-center gap-1 text-[11px] font-semibold text-amber-800 bg-amber-100 px-1.5 py-0.5 rounded" title={`${attentionCount} ${attentionCount === 1 ? 'class needs' : 'classes need'} attention`}>
                                                            <AlertTriangleIcon className="w-3.5 h-3.5 text-amber-600" aria-hidden="true" />
                                                            <span className="sr-only">, </span>{attentionCount} to fix
                                                        </span>
                                                    )}
                                                </button>
                                            )
                                        })}
                                    </div>

                                    {/* Tab Content */}
                                    {/* No inner scroll area: every class is visible as the page scrolls. */}
                                    <div className="p-4 bg-white">
                                        {gradesWithClasses.filter(g => g.id === currentTabId).map((g) => {
                                            const staffForGrade = data.staffing.filter(s => s.gradeId === g.id);
                                            const attentionCount = countNeedingAttention(g.id);
                                            const classCount = countClasses(g.id);
                                            const pasted = pasteFor === g.id ? parsePastedClasses(pasteText) : [];
                                            return (
                                                <div key={g.id} id={`grade-panel-${g.id}`} role="tabpanel" aria-labelledby={`grade-tab-${g.id}`} className="space-y-4 animate-pop">
                                                    <div className="flex flex-wrap items-center justify-between gap-2 pb-2">
                                                        <span className="font-semibold text-slate-800 text-base">Classes for {g.name}</span>
                                                        <div className="flex items-center gap-2">
                                                            <span className={`text-[11px] font-bold px-2 py-1 rounded tracking-wide ${attentionCount ? 'text-amber-800 bg-amber-100' : 'text-slate-600 bg-slate-100'}`}>
                                                                {classCount} {classCount === 1 ? 'class' : 'classes'}
                                                                {attentionCount > 0 && ` · ${attentionCount} ${attentionCount === 1 ? 'needs' : 'need'} attention`}
                                                            </span>
                                                            <Button variant="outline" className="h-8 px-3 text-xs" aria-expanded={pasteFor === g.id}
                                                                onClick={() => { setPasteFor(pasteFor === g.id ? null : g.id); setPasteText(""); }}>
                                                                Paste from a spreadsheet
                                                            </Button>
                                                        </div>
                                                    </div>

                                                    {pasteFor === g.id && (

                                    type="button"
                                    onClick={() => toggleSummary('specialists')}
                                    aria-expanded={expandedSummary.specialists}
                                    aria-controls="summary-specialists"
                                    className="flex-1 flex justify-between items-center text-sm font-bold text-slate-900 uppercase tracking-wider hover:text-brand-dark transition-colors"
                                >
                                    <span className="flex items-center gap-2"><StarIcon className="w-4 h-4 text-slate-500" aria-hidden="true" /> Specialist Profiles ({specialists.length})</span>
                                    {expandedSummary.specialists ? <ChevronUpIcon className="w-5 h-5 text-slate-500" aria-hidden="true" /> : <ChevronDownIcon className="w-5 h-5 text-slate-500" aria-hidden="true" />}
                                </button>
                                    {renderEditLink(3, 'specialists')}
                                </div>

                                {expandedSummary.specialists && (
                                    <ul id="summary-specialists" className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-800 animate-pop">
                                        {specialists.map(s => (
                                            <li key={s.id} className="bg-slate-50 p-2.5 rounded-md border border-slate-100 flex flex-col gap-1 shadow-sm">
                                                <span className="font-semibold text-slate-900">{s.name}</span>
                                                <div className="flex items-center gap-2 flex-wrap">
                                                    <span className="text-xs text-brand-dark font-medium bg-brand-green/10 px-2 py-0.5 rounded-md">{s.kla || 'No KLA Assigned'}</span>
                                                    <span className="text-xs text-slate-600 font-medium bg-slate-200/70 px-2 py-0.5 rounded-md">{s.cycle || 1} Week{(s.cycle || 1) > 1 ? 's' : ''}</span>
                                                </div>
                                            </li>
                                        ))}
                                        {specialists.length === 0 && <li className="text-slate-500 italic text-xs list-none col-span-2">None configured.</li>}
                                    </ul>
                                )}
                            </div>

                            {/* Activities */}
                            <div className="space-y-3 pt-2">
                                <div className="flex items-center gap-2 border-b border-slate-200 pb-1">
                                <button
                                    type="button"
                                    onClick={() => toggleSummary('activities')}
                                    aria-expanded={expandedSummary.activities}
                                    aria-controls="summary-activities"
                                    className="flex-1 flex justify-between items-center text-sm font-bold text-slate-900 uppercase tracking-wider hover:text-brand-dark transition-colors"
                                >
                                    <span className="flex items-center gap-2"><ActivityIcon className="w-4 h-4 text-slate-500" aria-hidden="true" /> Extra-Curriculars ({activities.length})</span>
                                    {expandedSummary.activities ? <ChevronUpIcon className="w-5 h-5 text-slate-500" aria-hidden="true" /> : <ChevronDownIcon className="w-5 h-5 text-slate-500" aria-hidden="true" />}
                                </button>
                                    {renderEditLink(3, 'extra-curricular activities')}
                                </div>

                                {expandedSummary.activities && (
                                    <ul id="summary-activities" className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-800 animate-pop">
                                        {activities.map(a => (
                                            <li key={a.id} className="bg-slate-50 p-2.5 rounded-md border border-slate-100 flex items-center gap-2 shadow-sm">
                                                <span className="w-1.5 h-1.5 rounded-full bg-slate-300" aria-hidden="true"></span>{a.name}
                                            </li>
                                        ))}
                                        {activities.length === 0 && <li className="text-slate-500 italic text-xs list-none col-span-2">None configured.</li>}
                                    </ul>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="w-full flex flex-col items-center">

                    {/* BRANDING HEADER */}
                    <div className="w-full flex flex-col sm:flex-row items-center sm:items-start gap-5 mb-8 sm:mb-10">
                        <div className="w-[84px] h-[84px] rounded-[1.25rem] bg-brand-bg flex items-center justify-center shrink-0 shadow-sm">
                            <GridIcon />
                        </div>
                        <div className="flex flex-col justify-center text-center sm:text-left pt-1">
                            <h1 className="text-[34px] leading-none font-extrabold tracking-tighter text-slate-900 mb-3">
                                the<span className="text-brand-green">timetable</span>tool<span className="text-brand-green">.</span>
                            </h1>
                            <p className="text-slate-500 text-[13.5px] font-medium leading-snug max-w-md">
                                Automated spreadsheet designed to help primary schools create NESA-compliant timetables.
                            </p>
                        </div>
                    </div>

                    {/* GENERATION PROGRESS SCREEN */}
                    {isGenerating ? (
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 overflow-hidden animate-pop flex flex-col">
                            <CardHeader className="border-b border-slate-200 bg-white p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 z-10 relative shadow-[0_4px_10px_-5px_rgba(0,0,0,0.05)]">
                                <div className="flex items-center gap-3">
                                    <div className="relative">
                                        <div className="w-10 h-10 rounded-full border-2 border-slate-200 border-t-brand-green animate-spin"></div>
                                        <div className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-slate-800">
                                            {loadingProgress}%
                                        </div>
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-900 leading-tight">Generating Timetable</h3>
                                        <p className="text-xs text-slate-500">Google Apps Script Execution Engine</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4 text-xs bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600">
                                    <div className="flex items-center gap-1.5">
                                        <ClockIcon />
                                        <span>Elapsed: <strong className="text-slate-900 font-mono">{formatElapsed(elapsedSeconds)}</strong></span>
                                    </div>
                                </div>
                            </CardHeader>

                            <CardContent className="p-6 sm:p-8 bg-slate-50 flex flex-col gap-6">
                                {/* Progress Bar */}
                                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
                                    <div className="flex justify-between items-center text-xs font-bold text-slate-700">
                                        <span className="uppercase tracking-wider text-slate-500">Total Completion</span>
                                        <span className="text-brand-dark font-mono text-sm">{loadingProgress}%</span>
                                    </div>
                                    <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden p-0.5 border border-slate-200"
                                        role="progressbar" aria-label="Timetable generation" aria-valuemin={0} aria-valuemax={100} aria-valuenow={loadingProgress}>
                                        <div
                                            className="bg-brand-dark h-full rounded-full transition-all duration-500 ease-out"
                                            style={{ width: `${loadingProgress}%` }}
                                        ></div>
                                    </div>
                                    <div className="flex items-center gap-2 pt-1 text-xs font-semibold text-slate-800 animate-pulse" aria-live="polite">
                                        <span className="w-2 h-2 rounded-full bg-brand-green"></span>
                                        <span>Current Action: <span className="font-normal text-slate-600">{loadingMessage || 'Processing...'}</span></span>
                                    </div>
                                </div>

                                {/* Live Activity Log Stream */}
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                                    <div className="bg-slate-100/70 px-4 py-2.5 border-b border-slate-200 flex items-center justify-between">
                                        <span className="text-xs font-bold uppercase tracking-wider text-slate-600 flex items-center gap-1.5">
                                            <ActivityIcon className="w-3.5 h-3.5 text-brand-dark" />
                                            Live Execution Log ({logs.length} events)
                                        </span>
                                        <span className="text-[10px] font-mono text-slate-500 bg-slate-200/80 px-2 py-0.5 rounded">
                                            Job ID: {activeJobId || 'Simulated'}
                                        </span>
                                    </div>

                                    <div
                                        ref={logContainerRef}
                                        className="p-4 max-h-[220px] overflow-y-auto custom-scrollbar font-mono text-xs space-y-2 bg-white text-slate-800"
                                    >
                                        {logs.map((log) => (
                                            <div key={log.id} className="flex items-start gap-2.5 leading-relaxed animate-pop">
                                                <span className="text-slate-400 text-[10px] shrink-0 pt-0.5 font-sans">{log.time}</span>
                                                <span className="text-brand-dark font-bold shrink-0">[{log.percent}%]</span>
                                                <span className="text-slate-700 break-words flex-1 font-sans">{log.text}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Callout Notice */}
                                <div className="bg-amber-50/80 border border-amber-200/80 p-3.5 rounded-lg flex items-start gap-3 text-xs text-amber-900">
                                    <AlertTriangleIcon className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
                                    <p className="leading-relaxed">
                                        For this school, generating takes {estimateGeneration(data).text}. <strong>Please keep this window open</strong> while Google Apps Script sets up your spreadsheet.
                                    </p>
                                </div>
                            </CardContent>
                        </Card>
                    ) : isSuccess ? (
                        /* SUCCESS SCREEN */
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 overflow-hidden animate-pop flex flex-col">
                            <CardContent className="p-12 flex flex-col items-center justify-center text-center min-h-[500px]">
                                <div className="animate-success mb-8">
                                    <div className="mx-auto bg-brand-green/10 w-24 h-24 rounded-full flex items-center justify-center text-brand-dark shadow-sm">
                                        <CheckIcon className="w-12 h-12" />
                                    </div>
                                </div>
                                <h3 className="text-3xl font-bold text-slate-800 mb-3">Timetable Generated</h3>
                                <p className="text-base text-slate-500 mb-10 max-w-md">Your timetable has been created and saved in the <strong>Timetables</strong> folder in your My Drive.</p>

                                <div className="flex flex-col sm:flex-row gap-4 w-full justify-center">
                                    <a href={generatedUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center whitespace-nowrap rounded-md text-base font-bold transition-all duration-200 active:scale-95 h-12 px-8 bg-brand-dark text-white hover:bg-[#00663C] shadow-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 focus-visible:ring-offset-2">
                                        Open Spreadsheet<span className="sr-only"> (opens in a new tab)</span>
                                    </a>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-3 w-full justify-center mt-6">
                                    <Button variant="outline" onClick={() => { setIsSuccess(false); setStep(4); }}>Back to the wizard</Button>
                                    <Button variant="outline" onClick={startNew}>Start a new timetable</Button>
                                </div>
                                <p className="text-xs text-slate-600 mt-4 max-w-md">"Back to the wizard" keeps this setup, for example to change something and generate again.</p>
                            </CardContent>
                        </Card>
                    ) : draftOffer ? (
                        /* RESUME SCREEN */
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 overflow-hidden animate-pop flex flex-col">
                            <CardContent className="p-10 flex flex-col items-center justify-center text-center min-h-[360px]">
                                <h2 className="text-2xl font-bold text-slate-800 mb-3">Continue where you left off?</h2>
                                <p className="text-base text-slate-600 mb-8 max-w-md">
                                    You have an unfinished timetable setup{draftOffer.data.schoolName ? <> for <strong>{draftOffer.data.schoolName}</strong></> : ''},
                                    saved {new Date(draftOffer.savedAt).toLocaleString([], { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })} at
                                    step {draftOffer.step || 1} ({STEP_NAMES[(draftOffer.step || 1) - 1]}).
                                </p>
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <Button variant="footerSolid" className="h-11 px-6" onClick={resumeDraft}>Resume</Button>
                                    <Button variant="outline" className="h-11 px-6" onClick={startNew}>Start new</Button>
                                </div>
                            </CardContent>
                        </Card>
                    ) : (
                        /* WIZARD SCREEN */
                        <React.Fragment>
                        <div className="w-full flex flex-wrap items-center justify-end gap-2 mb-3">
                            <span className="text-xs text-slate-600 mr-auto" aria-live="polite">{draftStatus}</span>
                            <input ref={fileInputRef} type="file" accept=".json,application/json" className="hidden" onChange={loadSetupFile} />
                            <Button variant="ghost" className="h-9 text-slate-700" onClick={() => fileInputRef.current && fileInputRef.current.click()}>Load a saved setup</Button>
                            <Button variant="ghost" className="h-9 text-slate-700" onClick={saveSetupFile}>Save setup to a file</Button>
                        </div>
                        {setupNotice && (
                            <div role="status" className={`w-full mb-3 p-3 rounded-lg border text-sm flex items-start gap-3 ${setupNotice.ok ? 'bg-brand-green/10 border-brand-green/20 text-slate-800' : 'bg-red-50 border-red-200 text-red-900'}`}>
                                <p className="flex-1">{setupNotice.text}</p>
                                <button type="button" onClick={() => setSetupNotice(null)} className="text-xs font-semibold underline">Dismiss</button>
                            </div>
                        )}
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 overflow-hidden flex flex-col">
                            <CardHeader className="border-b border-slate-200 bg-slate-50 px-6 py-8 sm:px-10 z-10 relative shadow-[0_4px_10px_-5px_rgba(0,0,0,0.05)]">
                                {/* Stepper Header */}
                                <div className="relative">
                                <div className="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-[2px] bg-slate-300 -z-10" aria-hidden="true"></div>
                                <ol aria-label="Steps" className="flex items-center justify-between relative">

                                    {[1, 2, 3, 4].map((s) => (
                                        <li key={s} aria-current={step === s ? "step" : undefined} className="flex flex-col items-center gap-2 bg-slate-50 px-2 sm:px-4">
                                            <div aria-hidden="true" className={`w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold border-2 transition-colors ${
                                                step === s ? 'border-slate-900 bg-slate-900 text-white shadow-md' :
                                                step > s ? 'border-brand-dark bg-brand-dark text-white' : 'border-slate-300 bg-white text-slate-500'
                                            }`}>
                                                {step > s ? <CheckIcon /> : s}
                                            </div>
                                            <span aria-hidden="true" className={`text-[10px] sm:text-[11px] font-semibold uppercase tracking-wider ${step >= s ? 'text-slate-900' : 'text-slate-500'} hidden md:block`}>
                                                {STEP_NAMES[s - 1]}
                                            </span>
                                            <span className="sr-only">Step {s}: {STEP_NAMES[s - 1]}{step > s ? ' (done)' : step === s ? ' (current step)' : ''}</span>
                                        </li>
                                    ))}
                                </ol>
                                </div>
                            </CardHeader>

                            <CardContent className="p-6 sm:p-10 min-h-[400px] bg-white relative flex-1">
                                <h2 ref={stepHeadingRef} tabIndex={-1} className="sr-only">Step {step} of 4: {STEP_NAMES[step - 1]}</h2>
                                {(() => {
                                    const problems = listProblems();
                                    if (!problems.length) return null;
                                    return (
                                        <div role="alert" className="mb-6 bg-red-50 border border-red-200 p-4 rounded-lg text-sm text-red-900 animate-pop">
                                            <p className="font-semibold mb-2 flex items-center gap-2">
                                                <AlertTriangleIcon className="w-4 h-4 text-red-600" aria-hidden="true" />
                                                {problems.length === 1 ? '1 thing needs fixing' : `${problems.length} things need fixing`} before you continue:
                                            </p>
                                            <ul className="list-disc pl-6 space-y-1">
                                                {problems.map((item, i) => (
                                                    <li key={i}>
                                                        {item.targetId
                                                            ? <button type="button" className="underline text-left hover:text-red-700" onClick={() => goToProblem(item)}>{item.text}</button>
                                                            : item.text}
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    );
                                })()}
                                {step === 1 && renderStep1()}
                                {step === 2 && renderStep2()}
                                {step === 3 && renderStep3()}
                                {step === 4 && generationError && (
                                    <div role="alert" className="mb-6 bg-red-50 border border-red-200 p-4 rounded-lg flex items-start gap-3 text-sm text-red-900 animate-pop">
                                        <AlertTriangleIcon className="w-5 h-5 text-red-600 shrink-0 mt-0.5" />
                                        <div className="flex-1">
                                            <p className="font-semibold mb-1">The timetable wasn't generated</p>
                                            <p className="whitespace-pre-line leading-relaxed">{generationError}</p>
                                        </div>
                                        <Button variant="outline" onClick={handleSubmit} className="shrink-0">Try again</Button>
                                    </div>
                                )}
                                {step === 4 && renderStep4()}
                            </CardContent>

                            <CardFooter className="flex items-start justify-between bg-slate-50 border-t border-slate-200 p-6 sm:px-10 h-28 pt-8 shrink-0">
                                <Button variant="outline" onClick={handleBack} disabled={step === 1}>
                                    Back
                                </Button>

                                {step < 4 ? (
                                    <Button variant="default" onClick={handleNext}>Continue to Step {step + 1}</Button>
                                ) : (
                                    <Button variant="footerSolid" onClick={handleSubmit} disabled={isGenerating} className="gap-2 px-6">
                                        Generate Timetable Template
                                    </Button>
                                )}
                            </CardFooter>
                        </Card>
                        </React.Fragment>
                    )}

                    {/* SUITE TAG */}
                    <div className="mt-12 mb-4 text-[11px] font-medium text-brand-dark tracking-widest text-center uppercase">
                        A Sydney Catholic Schools Curriculum Tool - 2026
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

                            {data.breaks.length === 0 ? (
                                <div className="flex flex-col items-center justify-center p-8 border-2 border-dashed border-slate-200 rounded-lg bg-slate-50/50 text-slate-500 animate-pop">
                                    <CalendarIcon className="w-8 h-8 mb-3 text-slate-400" />
                                    <p className="text-sm font-medium text-slate-700 mb-1">No breaks configured</p>
                                    <p className="text-xs mb-4 text-center">Add lunch, recess, or standard transition times.</p>
                                    <Button variant="outline" size="sm" onClick={() => addToList('breaks', { name: "", start: "", end: "" })}>Add First Break</Button>
                                </div>
                            ) : (
                                data.breaks.map((b, i) => {
                                    const bMins = (b.start && b.end) ? (timeToMinutes(b.end) - timeToMinutes(b.start)) : 0;
                                    return (
                                    <div key={b.id} className="flex flex-col sm:flex-row items-start gap-3 p-3 bg-slate-50 border border-slate-100 rounded-lg animate-pop">
                                        <div className="w-full sm:w-1/4 lg:w-1/3">
                                            <Label htmlFor={`break-${b.id}-name`} className="text-xs mb-1 block">Break Name</Label>
                                            <Input id={`break-${b.id}-name`} placeholder="e.g. Lunch" value={b.name} onChange={(e) => updateList('breaks', i, 'name', e.target.value)} error={errors.breaks?.[i]?.name} />
                                        </div>
                                        <div className="flex gap-3 w-full sm:w-auto sm:flex-1 items-end">
                                            <div className="flex-1 sm:w-28">
                                                <Label htmlFor={`break-${b.id}-start`} className="text-xs mb-1 block">Start</Label>
                                                <Input id={`break-${b.id}-start`} type="time" step="300" value={b.start} onChange={(e) => updateList('breaks', i, 'start', e.target.value)} error={errors.breaks?.[i]?.start} />
                                            </div>
                                            <div className="flex-1 sm:w-28 relative">
                                                <Label htmlFor={`break-${b.id}-end`} className="text-xs mb-1 block">End</Label>
                                                <Input id={`break-${b.id}-end`} type="time" step="300" value={b.end} onChange={(e) => updateList('breaks', i, 'end', e.target.value)} error={errors.breaks?.[i]?.end} />
                                            </div>
                                            <div className="flex items-center">
                                                <div className="h-10 px-3 flex items-center justify-center bg-slate-200/50 border border-slate-200 text-slate-600 text-xs font-bold rounded-md whitespace-nowrap min-w-[72px]">
                                                    {bMins > 0 ? formatMinutes(bMins) : '0 min'}
                                                </div>
                                            </div>
                                            <div>
                                                <Button variant="bin" className="px-2 h-10 w-10 shadow-sm shrink-0" onClick={() => removeFromList('breaks', b.id)} aria-label={`Remove ${b.name.trim() || 'this break'}`}>
                                                    <TrashIcon />
                                                </Button>
                                            </div>
                                        </div>
                                    </div>
                                )})
                            )}
                        </div>
                    </div>

                    {/* Real-time Summary Box */}
                    <div className="bg-brand-green/10 p-4 rounded-lg border border-brand-green/20 flex flex-col sm:flex-row justify-between items-center mt-4 gap-4 shadow-sm animate-pop">
                        <div className="flex items-center gap-3">
                            <div className="bg-brand-dark text-white p-2.5 rounded-full shadow-sm">
                                <ClockIcon />
                            </div>
                            <div>
                                <span className="text-base font-bold text-slate-900 block">Daily Teaching Time</span>
                                <span className="text-xs text-slate-600 font-medium">Total Day: {formatMinutes(totalSchoolMins)}</span>
                            </div>
                        </div>
                        <div className="text-center sm:text-right">
                            <span className="text-2xl font-black text-brand-dark leading-none">{formatMinutes(dailyTeachingMins)}</span>
                            <span className="text-[11px] text-slate-500 block mt-0.5 font-medium">Minus {formatMinutes(totalBreakMins)} Breaks</span>
                        </div>
                    </div>
                </div>
            );

            const renderStep2 = () => (
                <div className="space-y-6 animate-step" key="step2">
                    <div className="flex items-center justify-between mb-2">
                        <div>
                            <h4 className="text-base font-semibold flex items-center gap-2"><LayersIcon className="w-5 h-5 text-brand-dark" /> Grade Information</h4>
                            <p className="text-sm text-slate-500 mt-1">Configure the cycle and class distribution per grade.</p>
                        </div>
                    </div>

                    <div id="list-container-grades" className="space-y-3 max-h-[calc(100vh-20rem)] overflow-y-auto custom-scrollbar p-1 -m-1">
                        {data.grades.map((g, i) => {
                            const isInactive = g.classes === 0;
                            return (
                                <div key={g.id} className={`flex flex-wrap sm:flex-nowrap items-start gap-3 p-3 rounded-lg transition-all duration-300 ${isInactive ? 'bg-slate-100 border border-slate-200 opacity-60 grayscale-[50%]' : 'bg-slate-50 border border-slate-100 shadow-sm animate-pop'}`}>
                                    <div className="w-full sm:flex-1">
                                        <Label className="text-xs mb-1 block">&nbsp;</Label>
                                        <div className={`h-10 flex items-center px-4 rounded-md font-bold transition-colors ${isInactive ? 'bg-transparent text-slate-500' : 'bg-slate-200/50 border border-slate-200 text-slate-700'}`}>
                                            {g.name}
                                        </div>
                                    </div>
                                    <div className="w-full sm:w-24">
                                        <Label htmlFor={`grade-${g.id}-classes`} className="text-xs mb-1 block">Total Classes</Label>

            const renderStep3 = () => {
                // A class needs attention if it has an error from the last check,
                // or its name or teacher is still blank. Blank rows are skipped.
                const classNeedsAttention = (s) => {
                    if (isBlankClass(s)) return false;
                    const globalIdx = data.staffing.findIndex(st => st.id === s.id);
                    const rowErrors = errors.staffing?.[globalIdx] || {};

                const countNeedingAttention = (gradeId) =>
                    data.staffing.filter(s => s.gradeId === gradeId && classNeedsAttention(s)).length;
                const countClasses = (gradeId) =>
                    data.staffing.filter(s => s.gradeId === gradeId && !isBlankClass(s)).length;
                const cycleMismatches = findCycleMismatches(data);

                // Arrow keys, Home and End move between the grade tabs.
                const tabIds = data.grades.filter(g => g.classes > 0).map(g => g.id);
                const onTabKeyDown = (e) => {
                    const index = tabIds.indexOf(currentTabId);
                    const next = { ArrowRight: tabIds[(index + 1) % tabIds.length], ArrowLeft: tabIds[(index - 1 + tabIds.length) % tabIds.length],
                        Home: tabIds[0], End: tabIds[tabIds.length - 1] }[e.key];
                    if (!next) return;
                    e.preventDefault();
                    setActiveGradeTab(next);
                    setTimeout(() => { const tab = document.getElementById(`grade-tab-${next}`); if (tab) tab.focus(); }, 0);
                };

                const gradesWithClasses = data.grades.filter(g => g.classes > 0);
                const currentTabId = activeGradeTab && gradesWithClasses.some(g => g.id === activeGradeTab)
                    ? activeGradeTab
                    : (gradesWithClasses.length > 0 ? gradesWithClasses[0].id : null);

                return (
                    <div className="space-y-8 animate-step" key="step3">
                        {/* Classroom Teachers */}
                        <div>

                                <h4 className="text-base font-semibold flex items-center gap-2"><UsersIcon className="w-5 h-5 text-brand-dark" /> Teacher Assignments</h4>

                            </div>

                            {gradesWithClasses.length === 0 ? (

                                                    role="tab"

                                            label: 'Paste from a spreadsheet',

                                    <div className="p-4 bg-white">

                                                                </Button>
                                                            </div>
                                                        </div>
                                                    )}

                                                    {staffForGrade.map((s, idx) => {
                                                        const globalIdx = data.staffing.findIndex(st => st.id === s.id);
                                                        const hasError = Object.values(errors.staffing?.[globalIdx] || {}).some(Boolean);
                                                        const isBlank = isBlankClass(s);
                                                        return (
                                                            <div key={s.id} id={`class-row-${s.id}`} className={`flex flex-col sm:flex-row items-start gap-3 p-3 rounded-lg border transition-colors ${hasError ? 'bg-red-50/60 border-red-300' : 'bg-slate-50 border-slate-100'}`}>
                                                                <div className="flex items-center justify-center bg-slate-200 text-slate-600 w-6 h-6 rounded-full text-xs font-bold sm:mt-[26px] mb-1 sm:mb-0 shrink-0" aria-hidden="true">
                                                                    {idx + 1}
                                                                </div>
                                                                <div className="flex-1 w-full">
                                                                    <Label htmlFor={`class-${s.id}-name`} className="text-xs mb-1 block">Class Name</Label>
                                                                    <Input id={`class-${s.id}-name`} placeholder="e.g. 3 Blue" value={s.className} onChange={(e) => updateList('staffing', globalIdx, 'className', e.target.value)} error={errors.staffing?.[globalIdx]?.className} />
                                                                </div>
                                                                <div className="flex-1 w-full">
                                                                    <Label htmlFor={`class-${s.id}-teacher`} className="text-xs mb-1 block">Assigned Teacher</Label>
                                                                    <Input id={`class-${s.id}-teacher`} placeholder={isBlank ? "Blank row: skipped" : "Teacher's name"} value={s.teacher} onChange={(e) => updateList('staffing', globalIdx, 'teacher', e.target.value)} error={errors.staffing?.[globalIdx]?.teacher} />
                                                                </div>
                                                                <div className="w-full sm:w-auto">
                                                                    <Label className="text-xs mb-1 block">&nbsp;</Label>
                                                                    <button
                                                                        ref={(el) => { colorTriggerRefs.current[s.id] = el; }}
                                                                        type="button"
                                                                        onClick={() => setColorPickerFor(prev => prev === s.id ? null : s.id)}
                                                                        aria-label={`Colour for ${s.className.trim() || `class ${idx + 1}`}`}

                                                                        aria-expanded={colorPickerFor === s.id}
                                                                        title="Choose class colour"
                                                                        className="group relative w-10 h-10 rounded-md border border-black/10 shadow-sm cursor-pointer transition-transform hover:scale-105"
                                                                        style={{ backgroundColor: s.color || CLASS_COLOR_PALETTE[0] }}
                                                                    >
                                                                        <PencilIcon aria-hidden="true" className="w-4 h-4 text-white absolute inset-0 m-auto opacity-0 group-hover:opacity-100 transition-opacity duration-150" style={{ filter: 'drop-shadow(0 0 1px rgba(0,0,0,0.5))' }} />
                                                                    </button>
                                                                    {colorPickerFor === s.id && ReactDOM.createPortal(
                                                                        <React.Fragment>
                                                                            <div className="fixed inset-0 z-40" onClick={() => setColorPickerFor(null)} />
                                                                            <div
                                                                                role="dialog"
                                                                                aria-label={`Colour for ${s.className.trim() || `class ${idx + 1}`}`}
                                                                                className="fixed z-50 p-2.5 bg-white border border-slate-200 rounded-lg shadow-xl animate-pop w-[152px]"
                                                                                style={{ top: colorPickerPos.top, left: colorPickerPos.left }}
                                                                            >
                                                                                <div className="grid grid-cols-4 gap-1.5">
                                                                                    {CLASS_COLOR_PALETTE.map((hex) => (
                                                                                        <button
                                                                                            key={hex}
                                                                                            type="button"
                                                                                            onClick={() => { updateList('staffing', globalIdx, 'color', hex); setColorPickerFor(null); }}
                                                                                            title={hex}
                                                                                            aria-label={`Colour ${hex}`}
                                                                                            aria-pressed={s.color === hex}
                                                                                            className={`w-5 h-5 rounded-sm border transition-all ${s.color === hex ? 'ring-2 ring-offset-1 ring-slate-400 border-white' : 'border-black/10 hover:scale-110'}`}
                                                                                            style={{ backgroundColor: hex }}
                                                                                        />
                                                                                    ))}
                                                                                    <label
                                                                                        htmlFor={`custom-color-${s.id}`}
                                                                                        title="Custom colour"
                                                                                        className={`relative w-5 h-5 rounded-sm border cursor-pointer overflow-hidden transition-all ${!CLASS_COLOR_PALETTE.includes(s.color) ? 'ring-2 ring-offset-1 ring-slate-400 border-white' : 'border-black/10 hover:scale-110'}`}
                                                                                        style={!CLASS_COLOR_PALETTE.includes(s.color) && s.color
                                                                                            ? { backgroundColor: s.color }

                                                                                    >
                                                                                        <input
                                                                                            id={`custom-color-${s.id}`}
                                                                                            type="color"
                                                                                            aria-label="Custom colour"
                                                                                            value={s.color || CLASS_COLOR_PALETTE[0]}
                                                                                            onChange={(e) => { updateList('staffing', globalIdx, 'color', e.target.value); setColorPickerFor(null); }}
                                                                                            className="absolute w-0 h-0 opacity-0"
                                                                                        />
                                                                                    </label>
                                                                                </div>
                                                                            </div>
                                                                        </React.Fragment>,
                                                                        document.body
                                                                    )}
                                                                </div>
                                                                {isBlank && <span className="text-xs italic text-slate-600 sm:self-center sm:mt-5">Blank: skipped</span>}
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Specialist Teachers */}
                        <div className="border-t border-slate-200 pt-6">
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <h4 className="text-base font-semibold flex items-center gap-2"><StarIcon className="w-5 h-5 text-brand-dark" /> Specialist Profiles</h4>
                                    <p className="text-sm text-slate-500 mt-1">Add specialist teachers and assign them to a KLA. Rows left blank are skipped.</p>
                                </div>
                                <Button variant="brand" size="sm" onClick={() => addToList('specialists', { name: "", kla: "", cycle: 1 })} className="h-8 gap-1">
                                    <PlusIcon className="w-4 h-4 mr-1" /> Add Specialist
                                </Button>
                            </div>

                            <div id="list-container-specialists" className="space-y-2 max-h-[300px] overflow-y-auto custom-scrollbar p-1 -m-1">
                                {data.specialists.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center p-6 border-2 border-dashed border-slate-200 rounded-lg bg-slate-50/50 text-slate-500 animate-pop">
                                        <p className="text-sm font-medium text-slate-700 mb-2">No specialist teachers added</p>
                                        <Button variant="outline" size="sm" onClick={() => addToList('specialists', { name: "", kla: "", cycle: 1 })}>Add Specialist</Button>
                                    </div>
                                ) : (
                                    data.specialists.map((s, i) => (
                                        <div key={s.id} className="animate-pop bg-slate-50 p-3 rounded-lg border border-slate-100 space-y-2">
                                        <div className="flex flex-col sm:flex-row items-start gap-2">

                                                <Label htmlFor={`spec-${s.id}-name`} className="text-xs mb-1 block">Specialist Name</Label>
                                                <Input id={`spec-${s.id}-name`} placeholder="e.g. Mr. Smith" value={s.name} onChange={(e) => updateList('specialists', i, 'name', e.target.value)} error={errors.specialists?.[i]?.name} />
                                            </div>
                                            <div className="w-full sm:flex-1">
                                                <Label htmlFor={`spec-${s.id}-kla`} className="text-xs mb-1 block">Assigned KLA</Label>
                                                <Select id={`spec-${s.id}-kla`} value={s.kla} onChange={(e) => updateList('specialists', i, 'kla', e.target.value)} error={errors.specialists?.[i]?.kla}>
                                                    <option value="">Select KLA...</option>
                                                    {data.klas.filter(k => k.name.trim() && !/^non[- ]?curricul(?:ar|um)$/i.test(k.name.trim())).map(k => (
                                                        <option key={k.id} value={k.name}>{k.name}</option>
                                                    ))}
                                                </Select>
                                            </div>
                                            <div className="w-full sm:w-40">
                                                <Label htmlFor={`spec-${s.id}-cycle`} className="text-xs mb-1 block">Cycle Length (Weeks)</Label>
                                                <Input id={`spec-${s.id}-cycle`} type="number" min="1" max={MAX_CYCLE_WEEKS} step="1" value={s.cycle} onChange={(e) => {
                                                    const val = parseInt(e.target.value, 10);
                                                    updateList('specialists', i, 'cycle', isNaN(val) ? 1 : Math.min(MAX_CYCLE_WEEKS, Math.max(1, val)));
                                                }} error={errors.specialists?.[i]?.cycle} />
                                            </div>
                                            <div className="w-full sm:w-auto">
                                                <Label className="text-xs mb-1 block">&nbsp;</Label>
                                                <Button variant="bin" className="px-2 shadow-sm w-full sm:w-10 h-10" onClick={() => removeFromList('specialists', s.id)} aria-label={`Remove ${s.name.trim() || 'this specialist'}`}>

                    .map(g => ({ grade: g, classes: classesToGenerate.filter(c => c.gradeId === g.id) }))
                    .filter(group => group.classes.length);
                const specialists = getSpecialistsToGenerate(data);
                const activities = data.activities.filter(a => a.name.trim());
                const estimate = estimateGeneration(data);
                const cycleMismatches = findCycleMismatches(data);

                // "Edit" beside a section heading, back to the step that sets it.

                const renderStat = (label, value, detail, highlight) => (
                    <div className={`rounded-lg border p-3 ${highlight ? 'bg-brand-green/10 border-brand-green/30' : 'bg-slate-50 border-slate-200'}`}>
                        <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-600">{label}</p>
                        <p className={`text-2xl font-bold mt-1 leading-tight ${highlight ? 'text-brand-dark' : 'text-slate-900'}`}>{value}</p>
                        <p className="text-xs text-slate-600 mt-0.5">{detail}</p>
                    </div>
                );

                return (
                    <div className="animate-step space-y-4" key="step4">
                        <div>
                            <h4 className="text-xl font-semibold text-slate-800">Ready to generate{schoolName ? <> for <span className="text-brand-dark">{schoolName}</span></> : ''}</h4>
                            <p className="text-sm text-slate-600 mt-1">Check the details, then generate. Use Edit to change anything.</p>
                        </div>

                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3" aria-label="At a glance" role="group">
                            {renderStat('Class tabs', classesToGenerate.length, plural(gradeGroups.length, 'grade', 'grades'))}
                            {renderStat('Specialist tabs', specialists.length, specialists.length ? [...new Set(specialists.map(s => s.kla))].join(', ') : 'None')}
                            {renderStat('Teaching time', formatMinutes(dailyTeachingMins), `a day · ${formatMinutes(dailyTeachingMins * 5)} a week`, true)}
                            {renderStat('Generating takes', estimate.short, 'plus Start here, DATA and OVERVIEW')}
                        </div>

                        {Object.keys(cycleMismatches).length > 0 && (
                            <div className="flex items-start gap-1.5 text-sm text-amber-900 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
                                <AlertTriangleIcon className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" aria-hidden="true" />
                                <div className="space-y-1">
                                    {specialists.filter(s => cycleMismatches[s.id]).map(s => (
                                        <p key={s.id}>{describeCycleMismatch(s, cycleMismatches[s.id])}</p>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="grid gap-4 md:grid-cols-2">
                            {renderCard('School day', [renderEditLink(1, 'school day and breaks')],
                                <dl className="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
                                    <div>
                                        <dt className="text-xs text-slate-600">Hours</dt>
                                        <dd className="font-semibold text-slate-900">{formatAMPM(data.schoolStart)} - {formatAMPM(data.schoolEnd)}</dd>
                                    </div>
                                    <div>
                                        <dt className="text-xs text-slate-600">Breaks</dt>
                                        <dd className="text-slate-900">
                                            {data.breaks.length ? data.breaks.map(b => (
                                                <span key={b.id} className="block">{b.name || 'Unnamed'} {formatAMPM(b.start)} - {formatAMPM(b.end)}</span>
                                            )) : 'None'}
                                        </dd>
                                    </div>
                                </dl>
                            )}
                            {renderCard(`Specialists (${specialists.length})`, [renderEditLink(3, 'specialists')],
                                specialists.length ? (
                                    <ul className="space-y-1 text-sm">
                                        {specialists.map(s => (
                                            <li key={s.id} className="flex items-baseline justify-between gap-3">
                                                <span className="font-medium text-slate-900">{s.name}</span>
                                                <span className="text-slate-600 text-right">{s.kla} · {s.cycle || 1}-week cycle</span>
                                            </li>
                                        ))}
                                    </ul>
                                ) : <p className="text-sm text-slate-600">None</p>
                            )}
                        </div>

                        {renderCard(`Classes (${classesToGenerate.length})`,
                            [renderEditLink(2, 'grades and cycle lengths', 'Edit grades'), renderEditLink(3, 'classes and teachers', 'Edit classes')],
                            <table className="w-full text-sm">
                                <tbody>
                                    {gradeGroups.map(group => (
                                        <tr key={group.grade.id} className="align-top border-t border-slate-100 first:border-t-0">
                                            <th scope="row" className="text-left font-semibold text-slate-900 py-1.5 pr-4 whitespace-nowrap w-0">
                                                {group.grade.name}
                                                <span className="block text-xs font-normal text-slate-600">{group.grade.cycle}-week cycle</span>
                                            </th>
                                            <td className="py-1.5">
                                                <ul className="flex flex-wrap gap-1.5">
                                                    {group.classes.map(c => (
                                                        <li key={c.id} className="inline-flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded px-2 py-0.5">
                                                            <span className="w-2.5 h-2.5 rounded-full border border-black/10" style={{ backgroundColor: c.color || CLASS_COLOR_PALETTE[0] }} aria-hidden="true"></span>
                                                            <span className="font-medium text-slate-900">{c.className}</span>
                                                            <span className="text-slate-600">{c.teacher}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}

                        {renderCard(`Extra-curricular activities (${activities.length})`, [renderEditLink(3, 'extra-curricular activities')],
                            activities.length ? (
                                <ul className="flex flex-wrap gap-1.5 text-sm">
                                    {activities.map(a => (
                                        <li key={a.id} className="bg-slate-50 border border-slate-200 rounded px-2 py-0.5 text-slate-900">{a.name.trim()}</li>
                                    ))}
                                </ul>
                            ) : <p className="text-sm text-slate-600">None</p>
                        )}
                    </div>
                );
            };

            return (
                <div className="w-full flex flex-col items-center">

                    {/* BRANDING HEADER, with the menu for saving and loading the setup */}
                    <div className="w-full flex items-center justify-between gap-4 mb-8">
                        <div className="flex items-center gap-4">
                            <div className="shrink-0 rounded-2xl shadow-md shadow-brand-dark/20">
                                <LogoMark />
                            </div>
                            <h1 className="text-[32px] leading-none font-extrabold tracking-tight text-slate-900">
                                the<span className="text-brand-dark">timetable</span>tool<span className="text-brand-green">.</span>
                            </h1>
                        </div>
                        {!isGenerating && !isSuccess && !draftOffer && (
                            <MoreMenu
                                boxed
                                icon={<MenuIcon />}
                                label="Menu"
                                items={[
                                    { label: 'Save setup to a file', hint: 'Download this setup to load again later, e.g. next year', onSelect: saveSetupFile },
                                    { label: 'Load a saved setup', hint: 'Fill the wizard from a setup file', onSelect: () => fileInputRef.current && fileInputRef.current.click() }
                                ]}
                            />
                        )}
                    </div>

                    {/* GENERATION PROGRESS SCREEN */}
                    {isGenerating ? (
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 animate-pop">
                            <CardContent className="p-8 sm:p-12 flex flex-col items-center text-center gap-5">
                                <h2 className="text-xl font-bold text-slate-900">Generating your timetable</h2>
                                <div className="w-full max-w-lg flex items-center gap-3">
                                    <div className="flex-1 bg-slate-100 h-3 rounded-full overflow-hidden border border-slate-200"
                                        role="progressbar" aria-label="Timetable generation" aria-valuemin={0} aria-valuemax={100} aria-valuenow={loadingProgress}>
                                        <div className="bg-brand-dark h-full rounded-full transition-all duration-500 ease-out" style={{ width: `${loadingProgress}%` }}></div>
                                    </div>
                                    <span className="text-sm font-mono font-semibold text-slate-700 w-12 text-right" aria-hidden="true">{loadingProgress}%</span>
                                </div>
                                {(() => {
                                    // The reminder, then three quips, then the reminder again...
                                    const reminder = `This usually takes ${estimateGeneration(data).text}. Please keep this window open.`;
                                    const quipNumber = quipTick - Math.floor(quipTick / 4) - 1;
                                    const text = quipTick % 4 === 0
                                        ? reminder
                                        : GENERATING_QUIPS[(quipStart.current + quipNumber) % GENERATING_QUIPS.length];
                                    return (
                                        <React.Fragment>
                                            <p key={quipTick} aria-hidden="true" className="text-sm text-slate-600 max-w-md min-h-[2.5rem] animate-pop">{text}</p>
                                            <p className="sr-only">{reminder}</p>
                                        </React.Fragment>
                                    );
                                })()}
                                <Button variant="ghost" className="h-9 text-slate-700" aria-expanded={showLogs} aria-controls="generation-log" onClick={() => setShowLogs(prev => !prev)}>
                                    {showLogs ? 'Hide the log' : 'View the log'}
                                </Button>
                                {showLogs && (
                                    <div id="generation-log" className="w-full max-w-lg text-left bg-slate-50 border border-slate-200 rounded-lg animate-pop">
                                        <div className="flex justify-between px-3 py-2 border-b border-slate-200 text-xs text-slate-600">
                                            <span>{plural(logs.length, 'step', 'steps')}</span>
                                            <span>Elapsed <span className="font-mono">{formatElapsed(elapsedSeconds)}</span></span>
                                        </div>
                                        <ol ref={logContainerRef} className="p-3 max-h-[220px] overflow-y-auto custom-scrollbar text-xs space-y-1.5">
                                            {logs.map((log) => (
                                                <li key={log.id} className="flex items-start gap-2.5 leading-relaxed">
                                                    <span className="text-slate-500 font-mono shrink-0">{log.time}</span>
                                                    <span className="text-slate-800 break-words flex-1">{log.text}</span>
                                                </li>
                                            ))}
                                        </ol>
                                    </div>
                                )}
                            </CardContent>
                        </Card>
                    ) : isSuccess ? (
                        /* SUCCESS SCREEN */
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 overflow-hidden animate-pop flex flex-col">
                            <CardContent className="p-12 flex flex-col items-center justify-center text-center min-h-[500px]">
                                <div className="animate-success mb-8">
                                    <div className="mx-auto bg-brand-green/10 w-24 h-24 rounded-full flex items-center justify-center text-brand-dark shadow-sm">
                                        <CheckIcon className="w-12 h-12" />
                                    </div>
                                </div>
                                <h3 className="text-3xl font-bold text-slate-800 mb-3">Timetable Generated</h3>
                                <p className="text-base text-slate-500 mb-10 max-w-md">Your timetable has been created and saved in the <strong>Timetables</strong> folder in your My Drive.</p>

                                <div className="flex flex-col sm:flex-row gap-4 w-full justify-center">
                                    <a href={generatedUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center whitespace-nowrap rounded-md text-base font-bold transition-all duration-200 active:scale-95 h-12 px-8 bg-brand-dark text-white hover:bg-[#00663C] shadow-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 focus-visible:ring-offset-2">
                                        Open Spreadsheet<span className="sr-only"> (opens in a new tab)</span>
                                    </a>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-3 w-full justify-center mt-6">
                                    <Button variant="outline" onClick={() => { setIsSuccess(false); setStep(4); }}>Back to the wizard</Button>
                                    <Button variant="outline" onClick={startNew}>Start a new timetable</Button>
                                </div>
                                <p className="text-xs text-slate-600 mt-4 max-w-md">"Back to the wizard" keeps this setup, for example to change something and generate again.</p>
                            </CardContent>
                        </Card>
                    ) : draftOffer ? (
                        /* RESUME SCREEN */
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 overflow-hidden animate-pop flex flex-col">
                            <CardContent className="p-10 flex flex-col items-center justify-center text-center min-h-[360px]">
                                <h2 className="text-2xl font-bold text-slate-800 mb-3">Continue where you left off?</h2>
                                <p className="text-base text-slate-600 mb-8 max-w-md">
                                    You have an unfinished timetable setup{draftOffer.data.schoolName ? <> for <strong>{draftOffer.data.schoolName}</strong></> : ''},
                                    saved {new Date(draftOffer.savedAt).toLocaleString([], { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })} at
                                    step {draftOffer.step || 1} ({STEP_NAMES[(draftOffer.step || 1) - 1]}).
                                </p>
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <Button variant="footerSolid" className="h-11 px-6" onClick={resumeDraft}>Resume</Button>
                                    <Button variant="outline" className="h-11 px-6" onClick={startNew}>Start new</Button>
                                </div>
                            </CardContent>
                        </Card>
                    ) : (
                        /* WIZARD SCREEN */
                        <React.Fragment>
                        <input ref={fileInputRef} type="file" accept=".json,application/json" className="hidden" onChange={loadSetupFile} aria-hidden="true" tabIndex={-1} />
                        <Card className="w-full shadow-lg border-0 ring-1 ring-slate-200 flex flex-col">
                            <CardHeader className="border-b border-slate-200 bg-slate-50 rounded-t-xl px-6 py-6 sm:px-10 z-10 relative">
                                <div className="flex items-start justify-between gap-4">
                                    <div className="min-w-0">
                                        <p className="text-xs font-semibold uppercase tracking-wider text-brand-dark" aria-hidden="true">Step {step} of 4</p>
                                        <h2 ref={stepHeadingRef} tabIndex={-1} className="text-2xl font-bold text-slate-900 mt-1 focus:outline-none">
                                            <span className="sr-only">Step {step} of 4: </span>{STEP_NAMES[step - 1]}
                                        </h2>
                                        <p className="text-sm text-slate-600 mt-1">{STEP_INFO[step - 1]}</p>
                                    </div>
                                </div>

                                {/* Progress: one segment per step */}
                                <div className="mt-5 flex gap-1.5" role="progressbar" aria-label="Wizard progress"
                                    aria-valuemin={1} aria-valuemax={4} aria-valuenow={step} aria-valuetext={`Step ${step} of 4: ${STEP_NAMES[step - 1]}`}>
                                    {[1, 2, 3, 4].map(s => (
                                        <div key={s} className="h-2 flex-1 rounded-full bg-slate-200 overflow-hidden">
                                            <div className={`h-full rounded-full transition-all duration-500 ease-out ${s < step ? 'w-full bg-brand-dark' : s === step ? 'w-1/2 bg-brand-green' : 'w-0'}`}></div>
                                        </div>
                                    ))}
                                </div>
                                <ol aria-label="Steps" className="mt-2 grid grid-cols-4 gap-1.5">
                                    {[1, 2, 3, 4].map(s => (
                                        <li key={s} aria-current={step === s ? "step" : undefined} className="min-w-0">
                                            {s < step ? (
                                                <button type="button" onClick={() => goToStep(s)}
                                                    className="inline-flex items-center gap-1 text-[11px] font-semibold uppercase tracking-wider text-brand-dark hover:underline rounded focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950">
                                                    <CheckIcon />
                                                    <span className="truncate">{STEP_NAMES[s - 1]}</span>
                                                    <span className="sr-only"> (done, go back)</span>
                                                </button>
                                            ) : (
                                                <span className={`block truncate text-[11px] font-semibold uppercase tracking-wider ${s === step ? 'text-slate-900' : 'text-slate-500'}`}>
                                                    {STEP_NAMES[s - 1]}
                                                    <span className="sr-only">{s === step ? ' (current step)' : ''}</span>
                                                </span>
                                            )}
                                        </li>
                                    ))}
                                </ol>
                            </CardHeader>

                            <CardContent className="p-6 sm:p-10 min-h-[400px] bg-white relative flex-1">
                                {(() => {
                                    const problems = listProblems();
                                    if (!problems.length) return null;
                                    return (
                                        <div role="alert" className="mb-6 bg-red-50 border border-red-200 p-4 rounded-lg text-sm text-red-900 animate-pop">
                                            <p className="font-semibold mb-2 flex items-center gap-2">
                                                <AlertTriangleIcon className="w-4 h-4 text-red-600" aria-hidden="true" />
                                                {problems.length === 1 ? '1 thing needs fixing' : `${problems.length} things need fixing`} before you continue:
                                            </p>
                                            <ul className="list-disc pl-6 space-y-1">
                                                {problems.map((item, i) => (
                                                    <li key={i}>
                                                        {item.targetId
                                                            ? <button type="button" className="underline text-left hover:text-red-700" onClick={() => goToProblem(item)}>{item.text}</button>
                                                            : item.text}
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    );
                                })()}
                                {step === 1 && renderStep1()}
                                {step === 2 && renderStep2()}
                                {step === 3 && renderStep3()}
                                {step === 4 && generationError && (
                                    <div role="alert" className="mb-6 bg-red-50 border border-red-200 p-4 rounded-lg flex items-start gap-3 text-sm text-red-900 animate-pop">
                                        <AlertTriangleIcon className="w-5 h-5 text-red-600 shrink-0 mt-0.5" />
                                        <div className="flex-1">
                                            <p className="font-semibold mb-1">The timetable wasn't generated</p>
                                            <p className="whitespace-pre-line leading-relaxed">{generationError}</p>
                                        </div>
                                        <Button variant="outline" onClick={handleSubmit} className="shrink-0">Try again</Button>
                                    </div>
                                )}
                                {step === 4 && renderStep4()}
                            </CardContent>

                            <CardFooter className="flex items-start justify-between bg-slate-50 rounded-b-xl border-t border-slate-200 p-6 sm:px-10 h-28 pt-8 shrink-0">
                                <Button variant="outline" onClick={handleBack} disabled={step === 1}>
                                    Back
                                </Button>

                                {step < 4 ? (
                                    <Button variant="default" onClick={handleNext}>Continue to Step {step + 1}</Button>
                                ) : (
                                    <Button variant="footerSolid" onClick={handleSubmit} disabled={isGenerating} className="gap-2 px-6">
                                        Generate Timetable Template
                                    </Button>
                                )}
                            </CardFooter>
                        </Card>
                        </React.Fragment>
                    )}

                    {/* Toast: always present so screen readers announce what appears in it */}
                    <div aria-live="polite" className="fixed top-4 inset-x-0 z-50 flex justify-center px-4 pointer-events-none">
                        {toast && (
                            <div role="status" className={`pointer-events-auto max-w-lg flex items-start gap-3 rounded-lg shadow-lg px-4 py-2.5 text-sm animate-pop ${
                                toast.tone === 'error' ? 'bg-red-700 text-white' : toast.tone === 'ok' ? 'bg-brand-dark text-white' : 'bg-slate-800 text-white'}`}>
                                {toast.tone === 'info' && <CheckIcon />}
                                <span className="flex-1">{toast.text}</span>
                                {toast.tone !== 'info' && (
                                    <button type="button" onClick={() => setToast(null)} className="text-xs font-semibold underline shrink-0">Dismiss</button>
                                )}
                            </div>
                        )}
                    </div>

                    {/* SUITE TAG */}
                    <div className="mt-12 mb-4 text-[11px] font-medium text-brand-dark tracking-widest text-center uppercase">
                        A Sydney Catholic Schools Curriculum Tool - 2026
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
